<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>넷마블 플레이어블 · 코어 서바이벌</title>
<style>
:root{
  --bg:#04030A; --card:#120C22;
  --ink:#FFFFFF; --ink2:rgba(255,255,255,.65); --ink3:rgba(255,255,255,.40);
  --border:rgba(255,255,255,.09);
  --coral:#E8502A; --magenta:#b7419a;
  --sans:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Mono',monospace;
  --radius:14px; --radius-sm:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
  font-family:var(--sans);color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 62% 42% at 50% 50%,
    rgba(142,92,247,.15) 0%, rgba(94,44,180,.06) 45%, rgba(4,3,10,0) 78%), var(--bg)}

/* 단일 스케일 상수로 제어되는 스테이지 (BASE 720x1280 = 9:16) */
#stage{position:relative;width:720px;height:1280px;transform-origin:50% 50%;
  background:var(--bg);overflow:hidden;flex:none}
#cv{position:absolute;inset:0;width:720px;height:1280px;display:block}
#ui{position:absolute;inset:0;pointer-events:none}

/* HUD·버튼은 전부 캔버스에 도트로 그린다. DOM은 탭 영역만 담당한다. */
.hit{position:absolute;pointer-events:auto;cursor:pointer;
  background:none;border:0;padding:0;margin:0;font:inherit;color:transparent;display:none}
.hit.on{display:block}
</style>
</head>
<body>

<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui">
    <button class="hit" id="ctaPill" aria-label="이 게임이 궁금하다면?"></button>
    <button class="hit" id="ctaMain" aria-label="이 게임이 궁금하다면?"></button>
  </div>
</div></div>

const CHARACTER = {
  name  : '세븐나이츠 · 리타',
  frames: RITA_ATTACK,   // ← 여기만 교체
  w     : 120,           // 표시 폭 (BASE 720 좌표계) · v3 172 에서 30% 축소
  fps   : 15,
  fallback: 'sigil'
};
/* ───────── 교체 슬롯 : 스토어 링크 ─────────
   넷마블 스토어 URL 수령 후 교체. 제작사 URL을 넣은 채로 내보내지 말 것. */
const CTA_URL = 'STORE_URL_HERE';   // ← 교체 필요

/* ───────── 교체 슬롯 : 배경 ─────────
   BG_IMAGE 에 이미지(data URI 또는 같은 폴더의 파일명)를 넣으면
   그 이미지가 배경으로 깔립니다(cover, 화면비 유지).
   비워두면 buildSky() 가 같은 톤의 보라 성운을 코드로 그립니다 —
   기본값은 비움. 외부 요청 0건과 용량을 그대로 유지하기 위함입니다.       */
const BG_IMAGE = '';

/* ───────── 1층 : Stage — 해상도 스케일 상수 1개 ───────── */
const BASE_W = 720, BASE_H = 1280;
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = 1;
function fit(){
  /* 전면 채우기(fill-rate)가 지배적이라 DPR을 1.5로 묶는다.
     실측(soft-raster 390x844): DPR2 = 11fps → DPR1 = 47fps. */
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = BASE_W * DPR; cv.height = BASE_H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const k = Math.min(innerWidth / BASE_W, innerHeight / BASE_H);
  stage.style.transform = 'scale(' + k + ')';
}
addEventListener('resize', fit); fit();

/* ───────── 1층 : 시드 RNG (재현 가능한 연출) ───────── */
let _seed = 20260909;
const rnd  = () => ((_seed = (_seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const rr   = (a,b) => a + rnd() * (b - a);
const TAU  = Math.PI * 2;
const clamp= (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;

/* ───────── 1층 : Input — 드래그 단일 조작 ───────── */
const input = { active:false, x:0, y:0, everTouched:false };
function toStage(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / (r.width / BASE_W),
           y:(e.clientY - r.top)  / (r.height/ BASE_H) };
}
function down(e){ input.active = true; input.everTouched = true; move(e); }
function move(e){ if(!input.active) return; const p = toStage(e); input.x = p.x; input.y = p.y; }
function up(){ input.active = false; }
cv.addEventListener('pointerdown', down);
addEventListener('pointermove', move);
addEventListener('pointerup', up);
addEventListener('pointercancel', up);

/* ───────── 2층 : 게임 상수 ───────── */
const CX = BASE_W/2, CY = 640;      // 코어 중심
const RING   = 252;                 // 점선 궤도 반경 (히어로가 도는 선)
const CORE_R = 50;
const SPAWN_R= 660;

const SKILLS = [
  { id:'core', name:'코어탄',  icon:'dot',  desc:'약하지만 공격속도가 빠른 유도탄' },
  { id:'bolt', name:'섬광',    icon:'bolt', desc:'적을 타고 흐르는 연쇄 번개' },
  { id:'nova', name:'노바',    icon:'nova', desc:'궤도를 따라 터지는 충격파' }
];

/* ───────── 1층 : Director — 초 단위 타임라인 ─────────
   타임라인이 상태를 지배한다. 게임 조건이 길이를 지배하지 않는다. */
const T = {
  TUTORIAL : 4.0,    // 0~4    조작 시연
  RISE     : 4.0,    // 4~12   상승
  LV_BOLT  : 7.0,    //        섬광 해금
  LV_NOVA  : 13.0,   //        노바 해금
  PRESSURE :12.0,    // 12~19  긴장 최고조 (몹 물량 최대)
  BOSS     :19.5,    // 19.5   보스 등장
  AWAKEN   :21.8,    // 21.8   각성 → 압도적 해소
  FINAL    :25.0,    // 25.0   마지막 일격 — 남은 적 전멸
  CLEAR    :27.6,    // 27.6   결과 + CTA (종료 ≈28초)
  PILL     :1.2      //        상시 CTA 노출 (빨리 띄운다)
};

let S, raf = 0, lastT = 0, hudAcc = 0;

function reset(){
  _seed = 20260909;
  S = {
    t:0, phase:'play', ended:false,
    hp:1000, hpMax:1000, hpFloor:170,      // ← 무패 장치 : HP 하한 클램프
    shield:100, shMax:100,
    combo:0, comboPulse:0, wave:1,
    level:1, xp:0, xpNeed:5, mult:1,
    enemies:[], bullets:[], fx:[], pops:[], bolts:[],
    heroAng:-Math.PI/2, heroTarget:-Math.PI/2, fireCd:0,
    skills: SKILLS.map((s,i) => ({ ...s, lv: i===0?1:0, dmg:0, on: i===0 })),
    boss:null, awakened:false, shake:0, flash:0, spawnAcc:0,
    hitstop:0, timeScale:1, zoom:1, burst:0, animT:0,
    hpFlash:0, shFlash:0, skillFx:[0,0,0], finalBlow:false, timers:[],
    kills:0, hintAng:-Math.PI/2, killPunchCd:0, comboTier:0
  };
  /* 주목도가 가장 높은 0~2초가 빈 화면이 되지 않게 미리 날아오는 적을 심는다 */
  for (let i=0;i<13;i++){ spawnEnemy(); S.enemies[i].r = rr(300, 660); }
  document.getElementById('ctaMain').classList.remove('on');
  document.getElementById('ctaPill').classList.add('on');
  hudAcc = 1; lastT = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

/* ───────── 2층 : 적 생성 곡선 (타임라인이 지배) ───────── */
function spawnRate(t){
  if (t < T.TUTORIAL)  return 2.4;
  if (t < T.PRESSURE)  return lerp(2.6, 9.5, (t - T.TUTORIAL)/(T.PRESSURE - T.TUTORIAL));
  if (t < T.BOSS)      return lerp(13.0, 21.0, (t - T.PRESSURE)/(T.BOSS - T.PRESSURE));
  if (t < T.BOSS + 0.6) return 0;      // 보스 등장 0.6초는 무대를 비운다
  if (t < T.AWAKEN)    return 13.0;
  if (t < T.FINAL)     return 20.0;   // 각성 구간 — 가장 강할 때 때릴 대상을 준다
  return 0;                            // 마지막 일격 이후는 잔해만
}
function spawnEnemy(){
  const t = S.t;
  const a = rnd() * TAU;
  let kind = 'ring';
  if (t > 5  && rnd() < .34) kind = 'shard';
  if (t > 11 && rnd() < .20) kind = 'heavy';
  const base = { ring:{hp:34,r:15,sp:96}, shard:{hp:60,r:15,sp:116}, heavy:{hp:165,r:24,sp:70} }[kind];
  const grow = 1 + t * 0.14;
  S.enemies.push({
    kind, a, r:SPAWN_R + rr(0,90),
    hp: base.hp*grow, hpMax: base.hp*grow, rad: base.r,
    sp: base.sp * rr(.9,1.12), rot: rnd()*TAU, phase: rnd()*TAU, hitFx:0
  });
}

/* ───────── 2층 : 데미지 ───────── */
function hurt(e, dmg, skillIdx){
  e.hp -= dmg; e.hitFx = 1;
  S.skills[skillIdx].dmg += Math.round(dmg);
  if (e.hp <= 0) kill(e);
}
function kill(e){
  e.dead = true;
  S.kills++; S.combo++; S.comboPulse = 1;
  /* 초당 수십 킬 구간에서 상시 흔들림이 되지 않도록 쿨다운을 건다 */
  if (S.killPunchCd <= 0){
    const big = e.kind === 'heavy';
    punch(big ? 6 : 3.2, big ? 1.014 : 1.006, big ? 0.03 : 0.015, 0, 0);
    S.killPunchCd = big ? 0.10 : 0.16;
  }
  /* 콤보 계단 — 50/100/200 돌파를 사건으로 */
  const tier = S.combo >= 200 ? 3 : S.combo >= 100 ? 2 : S.combo >= 50 ? 1 : 0;
  if (tier > S.comboTier){ S.comboTier = tier; punch(10, 1.025, 0.05, 0, 0); }
  S.xp += 1;
  const p = polar(e.a, e.r);
  boom(p.x, p.y, e.kind === 'heavy' ? 22 : 13, e.kind === 'shard');
  if (S.xp >= S.xpNeed){
    S.xp = 0; S.level++;
    S.xpNeed = Math.round(S.xpNeed * 1.11);
    S.mult = 1 + S.level * 0.05;
  }
}
function polar(a, r){ return { x: CX + Math.cos(a)*r, y: CY + Math.sin(a)*r }; }

/* 타격 연출 한 묶음 — 흔들림 / 줌 펀치 / 히트스톱 / 슬로모 / 플래시.
   광고 길이(S.t)는 실시간으로 흐르므로 슬로모를 걸어도 28초는 그대로다. */
function punch(shake, zoom, hitstop, slowmo, flash){
  S.shake     = Math.max(S.shake, shake);
  S.zoom      = Math.max(S.zoom, zoom);
  S.hitstop   = Math.max(S.hitstop, hitstop);
  if (slowmo) S.timeScale = Math.min(S.timeScale, slowmo);
  if (flash)  S.flash = Math.max(S.flash, flash);
}

function boom(x, y, n, magenta){
  for (let i=0;i<n;i++){
    const a = rnd()*TAU, sp = rr(60,300);
    S.fx.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, max:rr(.32,.62),
                r:rr(1.6,4), m:!!magenta });
  }
  S.fx.push({ ring:true, x, y, life:1, max:.34, r0:6, r1:n*2.6, m:!!magenta });
}
function pop(x, y, v){
  if (S.pops.length > 7) return;            // 화면이 숫자로 덮이지 않게
  S.pops.push({ x: x + rr(-16,16), y: y + rr(-12,12), v, life:1 });
}

/* ───────── 2층 : 스킬 ───────── */
function fireCore(dt){
  const sk = S.skills[0];
  /* 표적이 없으면 발사하지 않는다 — 빈 화면에 대고 쏘면 멈춘 것처럼 보인다 */
  if (!S.enemies.some(e => !e.dead) && !(S.boss && !S.boss.dead)){ S.fireCd = 0.05; return; }
  const rate = S.awakened ? 0.026 : lerp(0.115, 0.062, clamp((sk.lv-1)/4,0,1));
  S.fireCd -= dt;
  while (S.fireCd <= 0){
    S.fireCd += rate;
    const p = polar(S.heroAng, CHARACTER.w * 0.34);   // 총구 = 표시 폭에 연동
    const spread = S.awakened ? 3 : (sk.lv >= 3 ? 2 : 1);
    for (let i=0;i<spread;i++){
      const off = (i - (spread-1)/2) * 0.13;
      S.bullets.push({ x:p.x, y:p.y, a:S.heroAng + off, sp:660,
                       dmg: 26 * S.mult * (1 + (sk.lv-1)*0.4), life:1.5,
                       tr:[p.x,p.y, p.x,p.y, p.x,p.y] });   // 잔상 샘플 3점
    }
  }
}
function fireBolt(dt){
  const sk = S.skills[1]; if (!sk.on) return;
  sk.cd = (sk.cd || 0) - dt;
  if (sk.cd > 0) return;
  sk.cd = S.awakened ? 0.16 : lerp(0.95, 0.5, clamp((sk.lv-1)/4,0,1));
  const live = S.enemies.filter(e => !e.dead && e.r < SPAWN_R - 40);
  if (!live.length && !S.boss) return;
  const chain = S.awakened ? 9 : 3 + sk.lv;
  const pts = [{ x:CX, y:CY }];
  let pool = live.slice().sort((a,b)=>a.r-b.r).slice(0, chain);
  pool.forEach(e => {
    const p = polar(e.a, e.r); pts.push(p);
    hurt(e, 46 * S.mult * (1 + (sk.lv-1)*0.5), 1);
  });
  if (S.boss){
    pts.push({ x:S.boss.x, y:S.boss.y });
    bossHurt(78 * S.mult * (1 + sk.lv*0.5), 1);
  }
  if (pts.length > 1) S.bolts.push({ pts, life:1 });
}
function fireNova(dt){
  const sk = S.skills[2]; if (!sk.on) return;
  sk.cd = (sk.cd || 0) - dt;
  if (sk.cd > 0) return;
  sk.cd = S.awakened ? 1.15 : lerp(2.4, 1.5, clamp((sk.lv-1)/4,0,1));
  const dmg = 78 * S.mult * (1 + (sk.lv-1)*0.55);
  S.fx.push({ nova:true, life:1, max:.34, r0:CORE_R, r1: S.awakened ? 760 : 470 });
  const reach = S.awakened ? 700 : 420;
  S.enemies.forEach(e => { if (!e.dead && e.r < reach) hurt(e, dmg, 2); });
  if (S.boss) bossHurt(dmg * 1.4, 2);
  punch(S.awakened ? 17 : 11, S.awakened ? 1.055 : 1.03,
        S.awakened ? 0.05 : 0.038, 0, 0);
}

/* ───────── 2층 : 보스 ───────── */
function spawnBoss(){
  /* 균열은 등장할 때 한 번 뽑아 둔다 — 매 프레임 새로 뽑으면 깜빡인다.
     시드 RNG라 몇 번을 돌려도 같은 균열이 나온다. */
  const cracks = [];
  for (let i = 0; i < 6; i++){
    let a = i/6*TAU + rr(-0.28, 0.28);
    const pts = [];
    for (let r = 6; r <= 34; r += 7){
      a += rr(-0.30, 0.30);
      pts.push({ x: Math.cos(a)*r, y: Math.sin(a)*r });
    }
    cracks.push(pts);
  }
  S.boss = { x: CX + 186, y: CY - 170, hp:7600, hpMax:7600, rot:0, hitFx:0, t:0, cracks };
  punch(22, 1.09, 0.15, 0.42, 0.7);
  S.fx.push({ nova:true, life:1, max:.5, r0:420, r1:150 });   // 수축 링 = 등장
}
function bossHurt(d, i){
  if (!S.boss || S.boss.dead) return;
  S.boss.hp -= d; S.boss.hitFx = 1;
  S.skills[i].dmg += Math.round(d);
  if (S.boss.hp <= 0){
    S.boss.dead = true; S.combo += 40;
    const bx = S.boss.x, by = S.boss.y;
    for (let k=0;k<5;k++)
      S.timers.push({ at: S.t + k*0.09, fn: () => boom(bx+rr(-70,70), by+rr(-70,70), 30, k%2===0) });
    punch(26, 1.10, 0.16, 0.38, 1);
  }
}

/* ───────── 1층 : Director + 2층 업데이트 ───────── */
function update(dtRaw, real){
  /* 타임라인은 실경과시간으로 전진한다 — 저사양에서 프레임이 떨어져도
     광고 길이(28초)가 늘어나지 않게. 물리만 dt 캡을 쓴다. */
  S.t += Math.min(real, 0.25);
  const t = S.t;

  /* 연출 감쇠는 실시간(rdt), 게임 물리는 히트스톱·슬로모가 걸린 dt */
  const rdt = dtRaw;
  S.hitstop   = Math.max(0, S.hitstop - rdt);
  S.killPunchCd = Math.max(0, S.killPunchCd - rdt);
  S.timeScale += (1 - S.timeScale) * Math.min(1, rdt * 2.6);
  S.zoom      += (1 - S.zoom)      * Math.min(1, rdt * 5.5);
  S.burst      = Math.max(0, S.burst - rdt);
  const dt = S.hitstop > 0 ? 0 : dtRaw * S.timeScale;

  /* 웨이브 표기 : 타임라인에 종속 (게임 조건 아님) */
  S.wave = clamp(Math.floor(Math.pow(clamp(t / T.BOSS,0,1), 1.6) * 19) + 1, 1, 20);

  /* 타임라인 비트 */
  if (t >= T.LV_BOLT && !S.skills[1].on){
    S.skills[1].on = true; S.skills[1].lv = 1;
    S.skillFx[1] = 1; punch(9, 1.02, 0.04, 0, .35);
  }
  if (t >= T.LV_NOVA && !S.skills[2].on){
    S.skills[2].on = true; S.skills[2].lv = 1;
    S.skills[0].lv = 3; S.skills[1].lv = 2;
    S.skillFx[2] = 1; punch(9, 1.02, 0.04, 0, .35);
  }
  if (t >= T.BOSS && !S.boss) spawnBoss();
  if (t >= T.AWAKEN && !S.awakened){
    S.awakened = true;
    S.skills.forEach(s => { s.on = true; s.lv = 5; });
    S.mult = Math.max(S.mult, 3.2);
    /* 멘트 없이 연출로만 : 화면 정지 → 슬로모 → 강한 흔들림 + 줌 + 방사선 */
    punch(30, 1.13, 0.14, 0.30, 1);
    S.burst = 0.85;
    S.fx.push({ nova:true, life:1, max:.55, r0:CORE_R, r1:820 });
  }
  /* 마지막 일격 — 남은 적을 한 번에 쓸고 보스를 끝낸다 */
  if (t >= T.FINAL && !S.finalBlow){
    S.finalBlow = true;
    /* 마지막 일격 피해는 세 스킬에 나눠 넣는다 — 한 줄만 118k 가 되면
       피해 현황 그래프가 무너져 비교가 안 된다 */
    let wipe = 0;
    S.enemies.forEach(e => { if (!e.dead){ wipe += e.hp; kill(e); } });
    S.skills.forEach(k => { k.dmg += Math.round(wipe / 3); });
    if (S.boss && !S.boss.dead) bossHurt(S.boss.hp + 1, 2);
    S.fx.push({ nova:true, life:1, max:.75, r0:CORE_R, r1:900 });
    S.burst = 1.0;
    punch(34, 1.16, 0.20, 0.24, 1);
  }
  if (t >= T.CLEAR && !S.ended){ S.ended = true; showEnd(); }

  /* 긴장 곡선 : SHIELD가 먼저 마르고 HP가 깎인다.
     충돌은 여기서 더 깊게만 팔 수 있고 회복은 없다. 하한은 hpFloor. */
  const shTarget = t < 7.5 ? 100 : clamp(100 - (t - 7.5) / 4.6 * 100, 0, 100);
  const hpTarget = t < 11.0 ? 1000
                 : Math.max(S.hpFloor + 210, 1000 - (t - 11.0) / 11.0 * 620);
  const prevHp = S.hp, prevSh = S.shield;
  S.shield = Math.min(S.shield, shTarget);
  S.hp     = Math.max(S.hpFloor, Math.min(S.hp, hpTarget));
  if (prevHp - S.hp > 6) S.hpFlash = 1;      // 곡선 감소가 아니라 피격일 때만
  if (prevSh - S.shield > 6) S.shFlash = 1;
  S.hpFlash = Math.max(0, S.hpFlash - rdt * 3.4);
  S.shFlash = Math.max(0, S.shFlash - rdt * 3.4);
  S.skillFx = S.skillFx.map(v => Math.max(0, v - rdt * 1.6));

  /* 조작 : 드래그로 히어로를 궤도 위에서 선회 —
     무입력이면 가장 가까운 적으로 자동 선회(오토플레이 완주 보장) */
  if (input.active){
    S.heroTarget = Math.atan2(input.y - CY, input.x - CX);
  } else {
    let best = null, bd = 1e9;
    S.enemies.forEach(e => { if (!e.dead && e.r < bd){ bd = e.r; best = e; } });
    if (best) S.heroTarget = best.a;
    else if (S.boss && !S.boss.dead) S.heroTarget = Math.atan2(S.boss.y - CY, S.boss.x - CX);
  }
  let d = ((S.heroTarget - S.heroAng + Math.PI*3) % TAU) - Math.PI;
  S.heroAng += clamp(d, -9*dt, 9*dt);

  /* 손 가이드 — 조준을 앞서가는 유도점 (독립 각도면 조작을 잘못 가르친다) */
  S.hintAng = S.heroAng + 0.95;

  /* 스폰 */
  S.spawnAcc += spawnRate(t) * dt;
  while (S.spawnAcc >= 1){
    S.spawnAcc -= 1;
    if (S.enemies.length < 74) spawnEnemy();   // 상한 : 밀도 유지 + 프레임 방어
  }

  S.animT += dt;

  /* 스킬 */
  fireCore(dt); fireBolt(dt); fireNova(dt);

  /* 적 위치 1회 산출 — 총알 유도/충돌이 같은 좌표를 본다 */
  S.enemies.forEach(e => { const p = polar(e.a, e.r); e.px = p.x; e.py = p.y; });

  /* 총알 */
  S.bullets.forEach(b => {
    /* 잔상 샘플 : 최신 좌표를 앞으로 밀어 넣는다 (프레임당 1점, 배열 재사용) */
    b.tr[4] = b.tr[2]; b.tr[5] = b.tr[3];
    b.tr[2] = b.tr[0]; b.tr[3] = b.tr[1];
    b.tr[0] = b.x;     b.tr[1] = b.y;
    /* 약한 유도 : 무패 구조를 위해 명중을 보장 */
    let best = null, bd = 1e9;
    S.enemies.forEach(e => {
      if (e.dead) return;
      const da = Math.abs(((Math.atan2(e.py-b.y, e.px-b.x) - b.a + Math.PI*3) % TAU) - Math.PI);
      if (da < 0.5){
        const dd = Math.hypot(e.px-b.x, e.py-b.y);
        if (dd < bd){ bd = dd; best = { x:e.px, y:e.py }; }
      }
    });
    if (best){
      const want = Math.atan2(best.y - b.y, best.x - b.x);
      let dd = ((want - b.a + Math.PI*3) % TAU) - Math.PI;
      b.a += clamp(dd, -4*dt, 4*dt);
    }
    b.x += Math.cos(b.a) * b.sp * dt;
    b.y += Math.sin(b.a) * b.sp * dt;
    b.life -= dt;
    if (b.x < -60 || b.x > BASE_W+60 || b.y < -60 || b.y > BASE_H+60) b.life = 0;
  });

  /* 적 이동 + 충돌 */
  S.enemies.forEach(e => {
    if (e.dead) return;
    e.r -= e.sp * dt;
    e.a += Math.sin(S.t*0.7 + e.phase) * 0.14 * dt;
    e.rot += dt * 1.8;
    e.hitFx = Math.max(0, e.hitFx - dt*4);
    const p = polar(e.a, e.r);

    for (const b of S.bullets){
      if (b.life <= 0) continue;
      if (Math.hypot(b.x-p.x, b.y-p.y) < e.rad + 8){
        b.life = 0;
        hurt(e, b.dmg, 0);
        if (e.dead) pop(p.x, p.y, Math.round(b.dmg));
        break;
      }
    }
    /* 코어 접촉 : HP 감소 — 하한 클램프로 절대 패배하지 않음 */
    if (!e.dead && e.r <= CORE_R + e.rad){
      e.dead = true;
      const dmg = e.kind === 'heavy' ? 34 : 19;
      if (S.shield > 0) S.shield = Math.max(0, S.shield - dmg);
      else S.hp = Math.max(S.hpFloor, S.hp - dmg);   // ← 무패 : 절대 hpFloor 아래로 안 감
      S.combo = 0; punch(7, 1.012, 0.02, 0, 0);
      boom(p.x, p.y, 8, false);
    }
  });

  /* 보스 */
  if (S.boss && !S.boss.dead){
    const b = S.boss; b.t += dt; b.rot += dt * 0.55;
    b.hitFx = Math.max(0, b.hitFx - dt*3);
    b.x = CX + 186 + Math.sin(b.t*0.8) * 34;
    b.y = CY - 170 + Math.cos(b.t*0.6) * 22;
    for (const bu of S.bullets){
      if (bu.life <= 0) continue;
      if (Math.hypot(bu.x-b.x, bu.y-b.y) < 74){ bu.life = 0; bossHurt(bu.dmg, 0); }
    }
  }

  /* 정리 & 파티클 */
  S.enemies = S.enemies.filter(e => !e.dead && e.r > -40);
  S.bullets = S.bullets.filter(b => b.life > 0);
  S.fx.forEach(f => {
    f.life -= dt / f.max;
    if (!f.ring && !f.nova){ f.x += f.vx*dt; f.y += f.vy*dt; f.vx *= .94; f.vy *= .94; }
  });
  S.fx = S.fx.filter(f => f.life > 0);
  S.bolts.forEach(b => b.life -= dt * 5.5);
  S.bolts = S.bolts.filter(b => b.life > 0);
  S.pops.forEach(p => { p.life -= dt * 1.5; p.y -= dt * 42; });
  S.pops = S.pops.filter(p => p.life > 0);

  /* 예약 연출 처리 — setTimeout 대신 게임 시각으로 (녹화 시 재현성) */
  for (let i = S.timers.length - 1; i >= 0; i--)
    if (S.t >= S.timers[i].at){ S.timers[i].fn(); S.timers.splice(i,1); }

  S.comboPulse = Math.max(0, S.comboPulse - rdt*3.2);
  S.shake = Math.max(0, S.shake - rdt*34);
  S.flash = Math.max(0, S.flash - rdt*2.4);

}

/* ───────── 렌더 ───────── */
/* 정적 레이어는 1회만 만든다 — 매 프레임 생성은 물량 구간에서 프레임을 깎는다 */
/* ═══════ 네온 아케이드 렌더 레이어 ═══════
   딥 네이비 + 그리드 배경, 네온 시안/핑크/라임, 둥근 UI, 매끈한 볼드 타이포.
   (도트는 캐릭터 아트에만 — UI 글자는 도트로 만들지 않는다)              */
const $ = id => document.getElementById(id);
const SANS = "'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif";
const P = {
  bg0:'#04030A', bg1:'#1A0E33',                              // 우주 검정 → 성운 보라
  cyan:'#6DDBFF', cyanD:'#15A6D5', ice:'#D6F5FF',           // ★ 블루 기준색 #6DDBFF
  pink:'#FF4FA3', pinkD:'#C8267A',
  purple:'#8E5CF7',
  violet:'#8E5CF7', violetL:'#C9A4FF', violetD:'#6D2BF5',   // 탄막 : 글로우·잔상
  cta:'#6DDBFF', ctaL:'#B3ECFF', ctaD:'#00B8F5',            // CTA 버튼 — cyan 과 같은 블루
  gold:'#FFC83D',
  red:'#FF4D6D', redL:'#FF93AC',
  panel:'rgba(16,9,34,.80)', panelB:'rgba(190,162,255,.58)',
  ink:'#FFFFFF', ink2:'rgba(255,255,255,.74)', ink3:'rgba(255,255,255,.44)'
};

/* ── 기본 도형 헬퍼 ── */
function rrect(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}
function txt(str, x, y, size, color, align, weight, glow){
  ctx.font = (weight || 800) + ' ' + size + 'px ' + SANS;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  if (glow){ ctx.shadowColor = glow; ctx.shadowBlur = 16; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}
function tw(str, size, weight){
  ctx.font = (weight || 800) + ' ' + size + 'px ' + SANS;
  return ctx.measureText(str).width;
}
function diamond(cx, cy, s, col, glow){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI/4);
  if (glow){ ctx.shadowColor = col; ctx.shadowBlur = 10; }
  ctx.fillStyle = col; ctx.fillRect(-s/2, -s/2, s, s);
  ctx.restore(); ctx.shadowBlur = 0;
}

/* ── 네온 게이지 : 둥근 캡 + 안쪽 하이라이트 + 발광 ── */
function neonBar(x, y, w, h, ratio, c1, c2, flash){
  rrect(x, y, w, h, h/2);
  ctx.fillStyle = 'rgba(6,8,30,.88)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.stroke();
  const inner = h - 8, fw = (w - 8) * clamp(ratio, 0, 1);
  if (fw > 3){
    ctx.save();
    rrect(x+4, y+4, w-8, inner, inner/2); ctx.clip();
    const g = ctx.createLinearGradient(x, y, x, y+h);
    g.addColorStop(0, c2); g.addColorStop(1, c1);
    ctx.fillStyle = flash > 0.05 ? '#fff' : g;
    ctx.shadowColor = c1; ctx.shadowBlur = 14;
    rrect(x+4, y+4, fw, inner, inner/2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.34)';       // 윗면 하이라이트
    rrect(x+7, y+6, Math.max(0, fw-6), inner*0.34, inner*0.17); ctx.fill();
    ctx.restore();
  }
}
/* ── 둥근 패널 + 모서리 다이아 장식 ── */
function neonPanel(x, y, w, h){
  rrect(x, y, w, h, 14);
  ctx.fillStyle = P.panel; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = P.panelB; ctx.stroke();
}
/* ── 블루 CTA 버튼 ── */
function ctaButton(x, y, w, h, label, size, alpha){
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.shadowColor = 'rgba(109,219,255,.9)'; ctx.shadowBlur = 34;
  rrect(x, y, w, h, 16);
  const g = ctx.createLinearGradient(x, y, x, y+h);
  g.addColorStop(0, P.cta); g.addColorStop(1, P.ctaD);
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 5; ctx.strokeStyle = P.ctaL;
  rrect(x+4, y+4, w-8, h-8, 13); ctx.stroke();
  const pl = (cx, cy) => {                        // 모서리 십자 장식
    ctx.fillStyle = '#D6F5FF';
    ctx.fillRect(cx-10, cy-3, 20, 6); ctx.fillRect(cx-3, cy-10, 6, 20);
  };
  pl(x+26, y+22); pl(x+w-26, y+22); pl(x+26, y+h-22); pl(x+w-26, y+h-22);
  txt(label, x + w/2, y + h/2 + 1, size, '#fff', 'center', 800, 'rgba(0,0,0,.45)');
  ctx.restore();
}
function fmt(n){
  if (n >= 1000) return (n/1000).toFixed(n >= 10000 ? 0 : 1).replace('.0','') + 'k';
  return String(Math.round(n));
}
/* 색을 흰쪽으로 당긴다 — 네온의 '심'(가장 밝은 속)을 만들 때 쓴다 */
function lighten(c, t){
  if (c.charAt(0) !== '#') return c;          // rgba() 로 들어온 값은 그대로 둔다
  const n = parseInt(c.slice(1), 16);
  const m = v => Math.round(v + (255 - v) * t);
  return 'rgb(' + m((n>>16)&255) + ',' + m((n>>8)&255) + ',' + m(n&255) + ')';
}

/* ── 스킬/재화 글리프 ──
   네온은 두 번 긋는다 — 색으로 번지는 무리 한 겹, 그 위에 흰빛에 가까운 심.
   한 겹으로 같은 색만 번지게 하면 획이 자기 무리에 먹혀 뿌옇게 뭉친다. */
function glyph(kind, x, y, s, col){
  ctx.save(); ctx.translate(x, y);
  ctx.lineCap = 'round';
  const lw = Math.max(2, s*0.16);
  const shape = () => {
  if (kind === 'dot'){                        // Y 자 발사체
    ctx.beginPath(); ctx.moveTo(-s*.4,-s*.5); ctx.lineTo(0,0);
    ctx.lineTo(s*.4,-s*.5); ctx.moveTo(0,0); ctx.lineTo(0,s*.5); ctx.stroke();
  } else if (kind === 'bolt'){                // 별 폭발
    for (let i=0;i<6;i++){ const a=i/6*TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*s*.22, Math.sin(a)*s*.22);
      ctx.lineTo(Math.cos(a)*s*.55, Math.sin(a)*s*.55); ctx.stroke(); }
  } else if (kind === 'nova'){                // 링 + 코어
    ctx.beginPath(); ctx.arc(0,0,s*.42,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,s*.16,0,TAU); ctx.fill();
  } else if (kind === 'coin'){
    ctx.beginPath(); ctx.arc(0,0,s*.46,0,TAU); ctx.stroke();
    ctx.font = '800 ' + (s*.6) + 'px ' + SANS;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',0,s*.03);
  } else if (kind === 'moon'){
    ctx.beginPath(); ctx.arc(0,0,s*.46,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,s*.46,Math.PI/2,Math.PI*1.5); ctx.fill();
  } else if (kind === 'shield'){
    ctx.beginPath(); ctx.moveTo(0,-s*.5); ctx.lineTo(s*.42,-s*.24);
    ctx.lineTo(s*.42,s*.18); ctx.lineTo(0,s*.5); ctx.lineTo(-s*.42,s*.18);
    ctx.lineTo(-s*.42,-s*.24); ctx.closePath(); ctx.stroke();
  } else if (kind === 'clock'){
    ctx.beginPath(); ctx.arc(0,0,s*.44,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-s*.02); ctx.lineTo(0,-s*.26);
    ctx.moveTo(0,0); ctx.lineTo(s*.2,s*.06); ctx.stroke();
  }
  };
  ctx.strokeStyle = ctx.fillStyle = col;            // 1겹 : 색 무리
  ctx.lineWidth = lw;
  ctx.shadowColor = col; ctx.shadowBlur = s * 0.42;
  shape();
  ctx.strokeStyle = ctx.fillStyle = lighten(col, .62);   // 2겹 : 밝은 심
  ctx.lineWidth = lw * 0.5;
  ctx.shadowBlur = 0;
  shape();
  ctx.restore(); ctx.shadowBlur = 0;
}

/* ── 배경 굽기 : 우주 검정 + 보라 성운 + 별 ── */
const G = {};

/* 성운 배경을 한 번만 그려서 캔버스에 굽는다.
   시드 RNG를 쓰므로 몇 번을 열어도 같은 별자리가 나온다. */
function buildSky(k, W, H, cx, cy){
  k.fillStyle = P.bg0; k.fillRect(0, 0, W, H);

  /* 성운 본체 — 중앙이 밝고 바깥으로 길게 옅어진다.
     감쇠를 완만하게 깔아야 가장자리에 원 테두리가 생기지 않는다.
     세로로 1.14배 늘려 정원(正圓)으로 보이는 것도 피한다.               */
  k.save();
  k.translate(cx, cy); k.scale(1, 1.14); k.translate(-cx, -cy);
  const neb = k.createRadialGradient(cx, cy, 18, cx, cy, 450);
  neb.addColorStop(0,   'rgba(158,92,226,.42)');
  neb.addColorStop(.10, 'rgba(146,80,214,.32)');
  neb.addColorStop(.22, 'rgba(122,62,186,.205)');
  neb.addColorStop(.38, 'rgba(94,44,148,.110)');
  neb.addColorStop(.56, 'rgba(64,28,106,.052)');
  neb.addColorStop(.76, 'rgba(34,14,60,.018)');
  neb.addColorStop(1,   'rgba(4,3,10,0)');
  k.fillStyle = neb;
  k.fillRect(-W, -H, W*3, H*3);
  k.restore();

  /* 성운 결 — 정원(正圓)으로 보이지 않게 흐트러진 덩어리를 겹친다 */
  for (let i = 0; i < 8; i++){
    const ox = cx + rr(-200,200), oy = cy + rr(-250,250), rad = rr(120,310);
    const b = k.createRadialGradient(ox, oy, 0, ox, oy, rad);
    b.addColorStop(0, 'rgba(146,78,220,' + rr(.05,.12).toFixed(3) + ')');
    b.addColorStop(1, 'rgba(4,3,10,0)');
    k.fillStyle = b;
    k.beginPath(); k.arc(ox, oy, rad, 0, TAU); k.fill();
  }

  /* 별 — 대부분 흰 점, 열에 하나 정도가 붉은 별 */
  for (let i = 0; i < 300; i++){
    const x = rnd()*W, y = rnd()*H, sz = rr(1,2.4), a = rr(.25,1);
    const warm = rnd() < .11;
    k.globalAlpha = a;
    k.fillStyle = warm ? (rnd() < .5 ? '#E8836A' : '#FF9D74') : '#FFFFFF';
    k.fillRect(x, y, sz, sz);
    if (a > .88 && sz > 1.9){                      // 밝은 별에만 옅은 무리
      k.globalAlpha = .15;
      k.beginPath(); k.arc(x + sz/2, y + sz/2, sz*2.2, 0, TAU); k.fill();
    }
  }
  k.globalAlpha = 1;
}

function buildCache(){
  G.core = ctx.createRadialGradient(CX, CY, 4, CX, CY, 190);
  G.core.addColorStop(0,'rgba(142,92,247,.22)');   // 성운이 이미 보라라 코어 발광은 낮춘다
  G.core.addColorStop(.55,'rgba(60,40,150,.08)');
  G.core.addColorStop(1,'rgba(0,0,0,0)');

  G.danger = ctx.createRadialGradient(CX, CY, 300, CX, CY, 800);
  G.danger.addColorStop(0,'rgba(255,79,163,0)');
  G.danger.addColorStop(1,'rgba(255,79,163,1)');

  G.top = ctx.createLinearGradient(0,0,0,340);
  G.top.addColorStop(0,'rgba(4,3,10,1)');
  G.top.addColorStop(.52,'rgba(4,3,10,.98)');    // HUD 구역(~177px)까지는 불투명
  G.top.addColorStop(1,'rgba(4,3,10,0)');
  G.bot = ctx.createLinearGradient(0,BASE_H,0,BASE_H-460);
  G.bot.addColorStop(0,'rgba(4,3,10,1)');
  G.bot.addColorStop(.74,'rgba(4,3,10,.97)');    // HUD 구역(~940px)까지는 불투명
  G.bot.addColorStop(1,'rgba(4,3,10,0)');

  /* 흔들림(shake) 여유분 M 만큼 크게 굽고 -M 위치에 그린다 */
  const M = 40;
  G.sky = document.createElement('canvas');
  G.sky.width = BASE_W + M*2; G.sky.height = BASE_H + M*2;
  buildSky(G.sky.getContext('2d'), G.sky.width, G.sky.height, CX+M, CY+M);
}
buildCache();

/* BG_IMAGE 를 채우면 구워둔 성운을 그 이미지로 덮는다 (cover · 중앙 정렬) */
if (BG_IMAGE){
  const bgImg = new Image();
  bgImg.onload = () => {
    const k = G.sky.getContext('2d'), W = G.sky.width, H = G.sky.height;
    const s = Math.max(W / bgImg.width, H / bgImg.height);
    const dw = bgImg.width * s, dh = bgImg.height * s;
    k.globalAlpha = 1;
    k.fillStyle = P.bg0; k.fillRect(0, 0, W, H);
    k.drawImage(bgImg, (W-dw)/2, (H-dh)/2, dw, dh);
  };
  bgImg.src = BG_IMAGE;
}

/* ═══════ 프레임 렌더 ═══════ */
function draw(){
  ctx.save();
  if (S.zoom > 1.001){
    ctx.translate(CX, CY); ctx.scale(S.zoom, S.zoom); ctx.translate(-CX, -CY);
  }
  if (S.shake > 0.2) ctx.translate(rr(-S.shake,S.shake)*.5, rr(-S.shake,S.shake)*.5);

  ctx.drawImage(G.sky, -40, -40);

  const danger = clamp((S.t - T.PRESSURE) / 5, 0, 1)
               * (1 - clamp((S.t - T.AWAKEN)/0.7, 0, 1)) * (1 - S.hp/S.hpMax + .3);
  if (danger > 0.02){
    ctx.globalAlpha = danger * .34; ctx.fillStyle = G.danger;
    ctx.fillRect(0,0,BASE_W,BASE_H); ctx.globalAlpha = 1;
  }

  /* 궤도 : 점선 원 하나. 레퍼런스가 한 겹이라
     겹쳐 있던 바깥 실선(RING+48)과 안쪽 원(148)을 걷어냈다 */
  ctx.save();
  ctx.strokeStyle = 'rgba(201,164,255,.62)'; ctx.lineWidth = 2;
  ctx.shadowColor = P.violet; ctx.shadowBlur = 10;
  ctx.setLineDash([12,14]); ctx.lineDashOffset = -S.t * 14;
  ctx.beginPath(); ctx.arc(CX, CY, RING, 0, TAU); ctx.stroke();
  ctx.restore();

  /* 노바 링 */
  S.fx.forEach(f => {
    if (!f.nova) return;
    const p = 1 - f.life;
    ctx.strokeStyle = 'rgba(255,79,163,' + (f.life*f.life*.9) + ')';
    ctx.lineWidth = 8 * f.life + 2;
    ctx.shadowColor = P.pink; ctx.shadowBlur = 22*f.life;
    ctx.beginPath(); ctx.arc(CX, CY, lerp(f.r0,f.r1,p*p*0.6+p*0.4), 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
  });

  ctx.fillStyle = G.core; ctx.beginPath(); ctx.arc(CX, CY, 190, 0, TAU); ctx.fill();

  S.enemies.forEach(e => drawEnemy(e, e.px !== undefined ? e.px : polar(e.a,e.r).x,
                                      e.py !== undefined ? e.py : polar(e.a,e.r).y));
  if (S.boss && !S.boss.dead) drawBoss(S.boss);

  /* 연쇄 번개 */
  S.bolts.forEach(b => {
    ctx.strokeStyle = 'rgba(109,219,255,' + clamp(b.life,0,1) + ')';
    ctx.shadowColor = P.cyan; ctx.shadowBlur = 20;
    ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath();
    b.pts.forEach((q, i) => {
      if (i === 0){ ctx.moveTo(q.x, q.y); return; }
      const o = b.pts[i-1];
      ctx.lineTo((q.x+o.x)/2 + rr(-22,22), (q.y+o.y)/2 + rr(-22,22));
      ctx.lineTo(q.x, q.y);
    });
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + clamp(b.life*.9,0,1) + ')';
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.shadowBlur = 0;
  });

  /* 탄 : 퍼플 네온 다트 + 보라 잔상 */
  S.bullets.forEach(b => {
    /* 잔상 — 지나온 3점을 이어 꼬리로 흘린다. 뒤로 갈수록 옅어진다 */
    const tx = b.tr[4], ty = b.tr[5];
    if ((b.x-tx)*(b.x-tx) + (b.y-ty)*(b.y-ty) > 9){
      ctx.save();
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = P.violet; ctx.shadowBlur = 14;
      const tg = ctx.createLinearGradient(tx, ty, b.x, b.y);
      tg.addColorStop(0,  'rgba(109,43,245,0)');
      tg.addColorStop(.55,'rgba(142,92,247,.42)');
      tg.addColorStop(1,  'rgba(201,164,255,.80)');
      ctx.strokeStyle = tg; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.lineTo(b.tr[2], b.tr[3]); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.restore();
    }
    /* 탄두 — 심은 흰색으로 남긴다. 보라 성운 위에서도 탄이 묻히지 않게 */
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a + Math.PI/2);
    ctx.shadowColor = P.violet; ctx.shadowBlur = 20;
    const g = ctx.createLinearGradient(0, -17, 0, 11);
    g.addColorStop(0,   '#ffffff');
    g.addColorStop(.34, P.violetL);
    g.addColorStop(.62, P.violet);
    g.addColorStop(1,   'rgba(109,43,245,0)');
    ctx.fillStyle = g;
    rrect(-4.5, -17, 9, 28, 4.5); ctx.fill();
    ctx.restore();
  });
  ctx.shadowBlur = 0;

  drawHero(CX, CY, S.heroAng);

  /* 조준 마커 */
  const am = polar(S.heroAng, RING);
  ctx.save(); ctx.translate(am.x, am.y); ctx.rotate(S.heroAng);
  ctx.strokeStyle = P.cyan; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.shadowColor = P.cyan; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(-9,-12); ctx.lineTo(11,0); ctx.lineTo(-9,12); ctx.stroke();
  ctx.restore(); ctx.shadowBlur = 0;

  /* 파티클 */
  S.fx.forEach(f => {
    if (f.nova) return;
    if (f.ring){
      ctx.strokeStyle = (f.m ? 'rgba(255,79,163,' : 'rgba(109,219,255,') + f.life*.85 + ')';
      ctx.lineWidth = 3 * f.life + .6;
      ctx.beginPath(); ctx.arc(f.x, f.y, lerp(f.r0,f.r1,1-f.life), 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = (f.m ? 'rgba(255,79,163,' : 'rgba(220,235,255,') + f.life + ')';
      ctx.fillRect(f.x - f.r*f.life, f.y - f.r*f.life, f.r*f.life*2, f.r*f.life*2);
    }
  });

  if (S.burst > 0.01){
    const bs = S.burst / 1.0;
    ctx.save(); ctx.globalAlpha = bs * .5;
    ctx.strokeStyle = P.cyan; ctx.lineWidth = 3;
    for (let i=0;i<28;i++){
      const a = i/28*TAU + S.t*0.3;
      const r0 = lerp(100, 540, 1-bs), r1 = r0 + lerp(40, 220, 1-bs);
      ctx.beginPath();
      ctx.moveTo(CX+Math.cos(a)*r0, CY+Math.sin(a)*r0);
      ctx.lineTo(CX+Math.cos(a)*r1, CY+Math.sin(a)*r1); ctx.stroke();
    }
    ctx.restore();
  }

  ctx.fillStyle = G.top; ctx.fillRect(0,0,BASE_W,340);
  ctx.fillStyle = G.bot; ctx.fillRect(0,BASE_H-460,BASE_W,460);

  if (S.boss && !S.boss.dead) drawBossBar(S.boss);

  /* 데미지 숫자 — 골드 */
  S.pops.forEach(p => {
    if (p.y < 300 || p.y > 930) return;
    ctx.globalAlpha = clamp(p.life, 0, 1);
    txt(String(p.v), p.x, p.y, 30, p.big ? '#fff' : P.gold, 'center', 800, 'rgba(0,0,0,.75)');
  });
  ctx.globalAlpha = 1;

  if (S.combo > 1 && !S.finalBlow && S.t > T.TUTORIAL){
    const sc = 1 + S.comboPulse*0.14;
    ctx.save(); ctx.translate(CX, 268); ctx.scale(sc, sc);
    txt('COMBO ' + S.combo, 0, 0, [30,35,40,45][S.comboTier], '#fff', 'center', 800, P.pink);
    ctx.restore();
  }

  if (S.t < T.TUTORIAL && !input.everTouched){
    const h = polar(S.hintAng, RING);
    ctx.save();
    ctx.globalAlpha = .45; ctx.strokeStyle = P.violetL; ctx.lineWidth = 4;
    ctx.setLineDash([9,11]);
    ctx.beginPath(); ctx.arc(CX, CY, RING, S.heroAng, S.hintAng); ctx.stroke();
    ctx.restore();
    const pulse = 22 + 9 * (0.5 + 0.5*Math.sin(S.t*5));
    ctx.save();
    ctx.globalAlpha = .35; ctx.strokeStyle = P.cyan; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(h.x, h.y, pulse, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowColor = P.cyan; ctx.shadowBlur = 16;
    ctx.fillStyle = P.cyan;
    ctx.beginPath(); ctx.arc(h.x, h.y, 15, 0, TAU); ctx.fill();
    ctx.restore(); ctx.shadowBlur = 0;
    txt('드래그해서 조준하세요', CX, 252, 30, '#fff', 'center', 800, P.cyan);
  }

  if (S.flash > 0.01){
    ctx.fillStyle = 'rgba(255,255,255,' + (S.flash*.55) + ')';
    ctx.fillRect(0,0,BASE_W,BASE_H);
  }
  ctx.restore();

  if (!S.ended) drawHUD();
  if (S.t >= T.CLEAR) drawEnd();
}

/* ── 중앙 캐릭터 ── */
const heroFrames = (CHARACTER.frames || []).map(src => { const i = new Image(); i.src = src; return i; });
let heroReady = false;
if (heroFrames.length){
  let n = 0;
  heroFrames.forEach(i => i.onload = () => { if (++n === heroFrames.length) heroReady = true; });
}
function drawHero(x, y, a){
  ctx.save(); ctx.translate(x, y);
  const w = CHARACTER.w;
  const h = heroReady ? w * (heroFrames[0].height / heroFrames[0].width) : w * 0.7;
  /* 발밑 네온 보라 링 — 네온관처럼 두 번 긋는다.
     배경이 보라 성운이라 한 겹으로는 바닥에 묻힌다.
     굵은 헤일로로 자리를 만들고, 그 위에 흰빛 심을 얹어 캐릭터를 띄운다. */
  ctx.save();
  ctx.translate(0, h*0.40); ctx.scale(1, 0.30);
  const ringR = w*0.33;
  ctx.strokeStyle = P.violet;  ctx.lineWidth = 11;
  ctx.shadowColor = P.violet;  ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(0, 0, ringR, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#EADCFF';  ctx.lineWidth = 4;
  ctx.shadowColor = P.violetL;  ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(0, 0, ringR, 0, TAU); ctx.stroke();
  ctx.restore();
  if (heroReady){
    const im = heroFrames[Math.floor(S.animT * CHARACTER.fps) % heroFrames.length];
    if (Math.cos(a) < 0) ctx.scale(-1, 1);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(im, -w*0.42, -h*0.52, w, h);
    ctx.imageSmoothingEnabled = true;
  } else {
    ctx.fillStyle = P.cyan;
    ctx.beginPath(); ctx.arc(0,0,30,0,TAU); ctx.fill();
  }
  ctx.restore();
}
/* heavy 적의 도트 도형 — 15×15 셀에 미리 찍어 둔다.
   [열, 행, 폭, 높이] · 가운데 사각 + 직교 4팔(못 모양) + 대각 4팔(계단 쐐기).
   90° 돌려도 같은 그림이 되도록 좌표를 맞춰 뒀다.                       */
const HEAVY_CELLS = [
  [6,6,3,3],                                      // 가운데 사각
  [6,0,3,2],  [7,2,1,3],                          // 위   : 넓은 머리 + 가는 대
  [6,13,3,2], [7,10,1,3],                         // 아래
  [0,6,2,3],  [2,7,3,1],                          // 왼쪽
  [13,6,2,3], [10,7,3,1],                         // 오른쪽
  [12,2,2,1], [11,3,3,1], [10,4,3,1], [9,5,2,1],  // 오른위 계단
  [1,2,2,1],  [1,3,3,1],  [2,4,3,1],  [4,5,2,1],  // 왼위
  [12,12,2,1],[11,11,3,1],[10,10,3,1],[9,9,2,1],  // 오른아래
  [1,12,2,1], [1,11,3,1], [2,10,3,1], [4,9,2,1]   // 왼아래
];

/* ── 적 3종 : 레퍼런스의 화이트 동그라미 · 보석 · 불빛 ──
   세 종류가 형태로 구분돼야 물량 구간에서 뭐가 오는지 읽힌다.
   전부 같은 마름모였을 땐 색만 다른 한 덩어리로 보였다.                */
function drawEnemy(e, x, y){
  const hit = e.hitFx > 0;
  const px  = e.kind === 'heavy';                 // 도트 도형은 정수 좌표에 앉힌다
  const r = e.rad * (px ? 1.15 : 1);
  ctx.save(); ctx.translate(px ? Math.round(x) : x, px ? Math.round(y) : y);

  if (e.kind === 'ring'){
    /* 화이트 동그라미 — 속이 빈 흰 링 */
    ctx.strokeStyle = hit ? '#FFFFFF' : 'rgba(255,255,255,.92)';
    ctx.lineWidth = Math.max(2, r * 0.17);
    ctx.shadowColor = '#FFFFFF'; ctx.shadowBlur = hit ? 22 : 9;
    ctx.beginPath(); ctx.arc(0, 0, r * .82, 0, TAU); ctx.stroke();

  } else if (e.kind === 'shard'){
    /* 보석 — 파란 마름모를 네 면으로 갈라 각을 만든다 */
    ctx.rotate(e.rot * 0.5);
    ctx.shadowColor = P.cyan; ctx.shadowBlur = hit ? 26 : 13;
    ctx.fillStyle = hit ? '#FFFFFF' : P.cyan;
    ctx.beginPath();
    ctx.moveTo(0,-r); ctx.lineTo(r*.72,0); ctx.lineTo(0,r); ctx.lineTo(-r*.72,0);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.95)';           // 왼쪽 위 면
    ctx.beginPath();
    ctx.moveTo(0,-r); ctx.lineTo(-r*.72,0); ctx.lineTo(0,0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.42)';           // 오른쪽 아래 면
    ctx.beginPath();
    ctx.moveTo(0,r); ctx.lineTo(r*.72,0); ctx.lineTo(0,0);
    ctx.closePath(); ctx.fill();

  } else {
    /* 도트 도형 — 무리는 그라디언트 한 장으로 깔고, 도형은 셀로 또렷하게 찍는다.
       셀마다 그림자를 걸면 물량 구간에서 프레임이 깎이고 가장자리도 뭉갠다.
       회전은 걸지 않는다 — 도트를 각도로 돌리면 계단이 무너진다.            */
    const bg = ctx.createRadialGradient(0,0,0, 0,0, r*1.9);
    bg.addColorStop(0,  'rgba(255,255,255,' + (hit ? .60 : .40) + ')');
    bg.addColorStop(.34,'rgba(190,235,255,' + (hit ? .34 : .20) + ')');
    bg.addColorStop(1,  'rgba(109,219,255,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0,0, r*1.9, 0, TAU); ctx.fill();

    const cell = Math.max(1, Math.round(r * 2.3 / 15));
    const o = -Math.round(cell * 7.5);
    ctx.fillStyle = hit ? '#FFFFFF' : 'rgba(255,255,255,.95)';
    for (const c of HEAVY_CELLS)
      ctx.fillRect(o + c[0]*cell, o + c[1]*cell, c[2]*cell, c[3]*cell);
  }
  ctx.restore(); ctx.shadowBlur = 0;
}
/* ── 보스 ── */
/* 도넛 조각 하나 — 장갑판·구동링을 같은 헬퍼로 그린다 */
function ringSeg(r0, r1, a0, a1){
  ctx.beginPath();
  ctx.arc(0, 0, r1, a0, a1);
  ctx.arc(0, 0, r0, a1, a0, true);
  ctx.closePath();
}
/* 보스 : 기계 하우징에 갇힌 균열 난 에너지 코어.
   체력이 깎일수록 균열이 늘고 벌어진다 — 남은 체력을 형태로도 읽게 한다. */
function drawBoss(b){
  const hot = b.hitFx > 0;
  const dmg = 1 - clamp(b.hp / b.hpMax, 0, 1);
  ctx.save(); ctx.translate(b.x, b.y);

  /* 바깥 발광 — 화면에서 보스 자리를 먼저 알린다 */
  const g = ctx.createRadialGradient(0,0,10,0,0,150);
  g.addColorStop(0,'rgba(255,79,163,.5)'); g.addColorStop(1,'rgba(255,79,163,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,150,0,TAU); ctx.fill();

  /* 바깥 장갑판 6장 — 어두운 금속에 시안 테두리 */
  ctx.save(); ctx.rotate(b.rot);
  const span = TAU/6 * 0.74;
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = hot ? '#FFFFFF' : P.cyan;
  ctx.shadowColor = P.cyan; ctx.shadowBlur = hot ? 28 : 14;
  for (let i = 0; i < 6; i++){
    const a0 = i/6*TAU - span/2;
    ringSeg(54, 76, a0, a0 + span);
    ctx.fillStyle = '#0C0A1C'; ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  /* 안쪽 구동링 3장 — 반대로 돈다. 부품이 따로 움직여야 기계로 읽힌다 */
  ctx.save(); ctx.rotate(-b.rot * 1.6);
  ctx.shadowColor = P.violet; ctx.shadowBlur = hot ? 22 : 12;
  ctx.fillStyle = hot ? P.violetL : P.violet;
  for (let i = 0; i < 3; i++){
    const a0 = i/3*TAU;
    ringSeg(41, 48, a0, a0 + TAU/3 * 0.58);
    ctx.fill();
  }
  ctx.restore();
  ctx.shadowBlur = 0;

  /* 에너지 코어 — 레퍼런스의 흰 결정(보석). 숨 쉬듯 뛴다.
     방사 그라디언트 구슬은 면이 없어 평평해 보였다.
     면 넷을 밝기 순으로 깔면 같은 실루엣이 깎인 돌로 읽힌다.          */
  const puls = 1 + Math.sin(b.t * 3.4) * 0.05;
  const gw = 33 * puls, gh = 45 * puls;          // 세로로 긴 팔면체
  ctx.shadowColor = P.cyan; ctx.shadowBlur = hot ? 36 : 20;
  const face = (px, py, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(px, 0); ctx.lineTo(0, 0);
    ctx.closePath(); ctx.fill();
  };
  face(-gw, -gh, 'rgba(255,255,255,.97)');       // 왼쪽 위 — 빛 받는 면
  face( gw, -gh, 'rgba(198,233,255,.88)');
  face(-gw,  gh, 'rgba(146,201,238,.82)');
  face( gw,  gh, 'rgba(100,163,211,.76)');       // 오른쪽 아래 — 그늘
  ctx.shadowBlur = 0;

  /* 봉인 링 2줄 — 서로 다른 축으로 돈다. 결정이 갇혀 있다는 신호 */
  ctx.strokeStyle = 'rgba(160,226,255,.42)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(0, 0, gw*.95, gh*.30,  b.t*0.70, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, gw*.34, gh*.92, -b.t*0.50, 0, TAU); ctx.stroke();

  /* 결정 외곽선 */
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0,-gh); ctx.lineTo(gw,0); ctx.lineTo(0,gh); ctx.lineTo(-gw,0);
  ctx.closePath(); ctx.stroke();

  /* 균열 — 체력이 깎인 만큼 늘고 벌어진다.
     흰 결정 위라서 색을 뒤집는다 : 어두운 틈 + 새어 나오는 핑크 빛 */
  const shown = Math.round(dmg * b.cracks.length);
  if (shown > 0){
    ctx.save();
    ctx.beginPath();                              // 금은 결정 안쪽에만
    ctx.moveTo(0,-gh); ctx.lineTo(gw,0); ctx.lineTo(0,gh); ctx.lineTo(-gw,0);
    ctx.closePath(); ctx.clip();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const lw = 1.6 + dmg * 2.6;
    for (let i = 0; i < shown; i++){
      ctx.beginPath(); ctx.moveTo(0, 0);
      b.cracks[i].forEach(q => ctx.lineTo(q.x, q.y));
      ctx.strokeStyle = 'rgba(255,79,163,' + (.55 + dmg*.45) + ')';   // 새는 빛
      ctx.lineWidth = lw + 3.2;
      ctx.shadowColor = P.pink; ctx.shadowBlur = 12 + dmg * 14;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(22,6,34,.92)';                          // 갈라진 틈
      ctx.lineWidth = lw;
      ctx.shadowBlur = 0; ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore(); ctx.shadowBlur = 0;
}
function drawBossBar(b){
  const w = 420, h = 22, x = CX - w/2, y = 344, r = clamp(b.hp/b.hpMax, 0, 1);
  txt('BOSS', x + 4, y - 22, 22, '#fff', 'left', 800, 'rgba(0,0,0,.7)');
  txt(Math.round(r*100) + '%', x + w - 4, y - 22, 22, P.pink, 'right', 800, 'rgba(0,0,0,.7)');
  neonBar(x, y, w, h, r, P.pinkD, P.pink, 0);
}

/* ═══════ HUD ═══════ */
/* ───────── 레이아웃 그리드 ─────────
   좌우 여백을 한 값으로 묶는다. HUD·CTA·결과창이 전부 같은 세로선에 선다.
   (이전엔 24 / 40 / 54 세 값이 섞여 있어서 아래쪽이 들쭉날쭉했다) */
const GUT    = 24;                    // 화면 좌우 공통 여백
const CONT_L = GUT;                   // 24  — 모든 UI 블록의 왼쪽 선
const CONT_R = BASE_W - GUT;          // 696 — 오른쪽 선
const CONT_W = CONT_R - CONT_L;       // 672 — 꽉 찬 블록의 폭

const CTA_BTN = { x: CONT_L, y: 1158, w: CONT_W, h: 94 };

function drawHUD(){
  /* 재화 pill */
  const pill = (y, kind, col, val) => {
    rrect(24, y, 156, 44, 22);
    ctx.fillStyle = 'rgba(10,12,42,.8)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.stroke();
    glyph(kind, 48, y + 22, 28, col);
    txt(val, 164, y + 22, 25, '#fff', 'right', 800);
  };
  pill(18, 'coin', P.gold, String(300 + S.kills*2));   // 18~62
  pill(68, 'moon', P.cyan, '3k');                       // 68~112

  /* 웨이브 · 시계 — 두 줄 (실장님 전달 시안 기준)
     1행 : wave 라벨 + n/20 을 한 줄로 묶어 중앙 정렬. 라벨이 크고 숫자가 작다
     2행 : 시계 + 시간. 시간을 40px로 키워 무게 중심을 아래 줄에 둔다
     두 줄 다 실측 폭(tw)으로 잡아서 숫자 자릿수가 바뀌어도 중앙이 안 흔들린다 */
  const waveNum = S.wave + '/20';
  const lbW = tw('wave', 30, 800), numW = tw(waveNum, 26, 800);
  const lx = CX - (lbW + 10 + numW) / 2;
  txt('wave', lx, 32, 30, '#fff', 'left', 800, 'rgba(109,219,255,.55)');
  txt(waveNum, lx + lbW + 10, 33, 26, P.ink2, 'left', 800);

  const mm = String(Math.floor(S.t/60)).padStart(2,'0');
  const ss = String(Math.floor(S.t%60)).padStart(2,'0');
  const clockStr = mm + ':' + ss;
  const cW = tw(clockStr, 40, 800);
  const cx0 = CX - (34 + 12 + cW) / 2;
  glyph('clock', cx0 + 17, 89, 34, P.ink2);
  txt(clockStr, cx0 + 46, 89, 40, '#fff', 'left', 800);

  /* 설정 아이콘(장식) */
  ctx.save(); ctx.translate(CONT_R - 20, 46); ctx.rotate(S.t*0.3);
  ctx.strokeStyle = P.ink3; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0,0,9,0,TAU); ctx.stroke();
  for (let i=0;i<8;i++){ const a=i/8*TAU;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*14, Math.sin(a)*14);
    ctx.lineTo(Math.cos(a)*20, Math.sin(a)*20); ctx.stroke(); }
  ctx.restore();

  /* 경험치 */
  /* Lv 칩은 게이지와 따로 둔다 — 안에 넣으면 채움색이 배지 밑을 지나 겹쳐 보인다 */
  const XPY = 140, XPH = 24;
  rrect(24, XPY, 132, XPH, XPH/2);
  ctx.fillStyle = 'rgba(10,12,42,.85)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.stroke();
  txt('Lv.' + S.level, 62, XPY + XPH/2, 17, '#fff', 'center', 800);
  txt((S.xp/S.xpNeed*100).toFixed(0) + '%', 122, XPY + XPH/2, 16, P.cyan, 'center', 800);
  neonBar(168, XPY, 428, XPH, S.xp / S.xpNeed, P.cyanD, P.cyan, 0);
  txt('×' + S.mult.toFixed(2), 696, XPY + XPH/2, 24, P.cyan, 'right', 800, 'rgba(109,219,255,.5)');

  /* 체력 · 실드 */
  txt('HP: ' + Math.round(S.hp) + '/1000', 24, 958, 23, '#fff', 'left', 800);
  neonBar(24, 980, 330, 28, S.hp / S.hpMax, '#E0304F', P.redL, S.hpFlash);
  glyph('shield', 386, 958, 24, P.cyan);
  txt('SHIELD: ' + Math.round(S.shield) + '/100', 406, 958, 23, '#fff', 'left', 800);
  neonBar(366, 980, 330, 28, S.shield / S.shMax, P.cyanD, P.cyan, S.shFlash);

  /* 스킬 피해 현황 */
  neonPanel(24, 1026, 392, 118);
  txt('스킬 피해 현황', 42, 1046, 19, P.ink2, 'left', 700);
  const peak = Math.max(1, ...S.skills.map(k => k.dmg));
  const cols  = [P.cyanD, P.pinkD, '#6D3FD6'];
  const colsL = [P.cyan, P.pink, P.purple];
  /* 인게임은 수치가 계속 오른다. 실측값으로 재면 자릿수가 늘 때마다
     바 길이가 튀므로 최대 자릿수('999k')를 기준으로 한 번 재서 고정한다 */
  const barX = 66, barR = 400, gap = 14;
  const barW = barR - tw('999k', 19, 800) - gap - barX;
  S.skills.forEach((k, i) => {
    const y = 1076 + i*26;
    ctx.globalAlpha = k.on ? 1 : 0.3;
    glyph(k.icon, 48, y, 18, colsL[i]);
    neonBar(barX, y - 7, barW, 14, k.on ? k.dmg/peak : 0, cols[i], colsL[i], 0);
    txt(k.on ? fmt(k.dmg) : '-', barR, y, 19, '#fff', 'right', 800);
    ctx.globalAlpha = 1;
  });

  /* 상시 CTA */
  if (S.t >= T.PILL)
    ctaButton(CTA_BTN.x, CTA_BTN.y, CTA_BTN.w, CTA_BTN.h,
              '이 게임이 궁금하다면?', 40, clamp((S.t - T.PILL)/0.22, 0, 1));

  /* 마지막 일격 */
  if (S.finalBlow && !S.ended){
    const k = clamp((S.t - T.FINAL - 0.3) / 0.35, 0, 1);
    if (k > 0){
      const bob = Math.sin(S.t*4)*4;
      txt('ALL CLEAR', CX, 430 + bob, 68, '#fff', 'center', 800, P.cyan);
      txt('웨이브 20/20 격파', CX, 500 + bob, 27, P.cyan, 'center', 800, 'rgba(0,0,0,.7)');
    }
  }
}

/* ═══════ 결과 화면 ═══════ */
function drawEnd(){
  const a = clamp((S.t - T.CLEAR) / 0.4, 0, 1);
  ctx.fillStyle = 'rgba(5,3,14,' + a + ')';   // 완전 불투명 — 뒤 게임 화면이 비치지 않게
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  if (a < 0.2) return;

  txt('CLEAR', CX, 292, 92, '#fff', 'center', 800, P.cyan);

  txt('피해 현황', CX, 402, 24, P.ink2, 'center', 700);
  const peak = Math.max(1, ...S.skills.map(k => k.dmg));
  const cols  = [P.cyanD, P.pinkD, '#6D3FD6'];
  const colsL = [P.cyan, P.pink, P.purple];
  /* 게이지 길이는 실제 수치 폭을 재서 정한다 — 고정 폭이면 자릿수가 짧을 때
     바 끝과 숫자 사이에 빈 칸이 남는다. 결과창은 수치가 멈춘 화면이라
     실측값을 그대로 써도 길이가 흔들리지 않는다. 여백은 16px 고정 */
  const barX = CONT_L + 68, barR = CONT_R, gap = 16;
  const numW = Math.max(...S.skills.map(k => tw(fmt(k.dmg), 26, 800)));
  const barW = barR - numW - gap - barX;
  S.skills.forEach((k, i) => {
    const y = 462 + i*58;
    glyph(k.icon, CONT_L + 30, y, 30, colsL[i]);
    neonBar(barX, y - 14, barW, 28, k.dmg/peak, cols[i], colsL[i], 0);
    txt(fmt(k.dmg), barR, y, 26, '#fff', 'right', 800);
  });

  txt('전리품', CX, 662, 24, P.ink2, 'center', 700);
  neonPanel(CONT_L, 696, CONT_W, 122);
  const loot = [['dot', S.kills, P.cyan], ['nova', Math.max(1,Math.floor(S.kills/26)), P.purple],
                ['bolt', S.awakened ? 5 : 1, P.pink], ['coin', 300 + S.kills*2, P.gold],
                ['moon', S.level, P.cyan], ['shield', Math.round(S.combo/3)+12, P.ice]];
  loot.forEach((l, i) => {
    const x = CONT_L + CONT_W/6 * (i + 0.5);
    glyph(l[0], x, 742, 34, l[2]);
    txt(String(l[1]), x, 786, 22, '#fff', 'center', 800);
  });

  ctaButton(CTA_BTN.x, 862, CTA_BTN.w, 104, '이 게임이 궁금하다면?', 42, 1);
}

/* ───────── CTA 발동 체인 ───────── */
function go(){
  /* 광고 네트워크가 window.playableCTA 를 정의해 두면 그쪽으로 넘긴다
     (mraid.open 등). 없으면 새 탭, 그것도 막히면 현재 창 이동. */
  if (typeof window.playableCTA === 'function'){ window.playableCTA(CTA_URL); return; }
  try {
    if (!window.open(CTA_URL, '_blank')) location.href = CTA_URL;
  } catch(e){ location.href = CTA_URL; }
}
function placeHit(el, r){
  el.style.left = r.x + 'px'; el.style.top = r.y + 'px';
  el.style.width = r.w + 'px'; el.style.height = r.h + 'px';
}
placeHit($('ctaPill'), CTA_BTN);
placeHit($('ctaMain'), { x:CTA_BTN.x, y:862, w:CTA_BTN.w, h:104 });
$('ctaPill').addEventListener('click', go);
$('ctaMain').addEventListener('click', go);
/* 결과창에는 CTA 하나만 남긴다 — 다시 보기 버튼이 CTA와 시선을 나눠 갖지 않게 */
function showEnd(){ $('ctaMain').classList.add('on'); }

/* ───────── 루프 ───────── */
const RECORD = /[?&]record=1/.test(location.search);
function loop(now){
  if (RECORD) return;              // 녹화 모드에서는 외부에서 프레임을 밀어 넣는다
  raf = requestAnimationFrame(loop);
  const real = (now - lastT) / 1000; lastT = now;
  const dt = Math.min(real, 0.05);
  if (!S.ended || S.t < T.CLEAR + 0.5) update(dt, real);
  draw();
}
reset();

/* 녹화 하네스 : ?record=1 로 열면 rAF 대신 __step(dt) 로 한 프레임씩 전진한다.
   시드 RNG + 고정 dt 라서 몇 번을 돌려도 같은 영상이 나온다. */
if (RECORD){
  window.__step  = dt => { update(dt, dt); draw(); };
  window.__reset = () => { reset(); draw(); };
  window.__len   = () => T.CLEAR + 2.2;
  window.__reset();
}
</script>
