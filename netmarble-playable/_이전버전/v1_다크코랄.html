<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>넷마블 플레이어블 · 코어 서바이벌</title>
<style>
:root{
  --bg:#111111; --card:#1A1A1A;
  --ink:#FFFFFF; --ink2:rgba(255,255,255,.65); --ink3:rgba(255,255,255,.40);
  --border:rgba(255,255,255,.09);
  --coral:#E8502A; --magenta:#b7419a;
  --sans:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Mono',monospace;
  --radius:14px; --radius-sm:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
  font-family:var(--sans);color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 62% 42% at 50% 50%,
    rgba(232,80,42,.13) 0%, rgba(183,65,154,.05) 45%, rgba(17,17,17,0) 78%), var(--bg)}

/* ── 단일 스케일 상수로 제어되는 스테이지 (BASE 720x1280) ── */
#stage{position:relative;width:720px;height:1280px;transform-origin:50% 50%;
  background:var(--bg);overflow:hidden;flex:none}
#cv{position:absolute;inset:0;width:720px;height:1280px;display:block}
#ui{position:absolute;inset:0;pointer-events:none}

/* ── 상단 HUD ── */
.hud-top{position:absolute;left:0;right:0;top:0;padding:22px 24px 0}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--border);border-radius:999px;padding:9px 18px 9px 9px;
  font:600 22px/1 var(--mono);letter-spacing:.02em}
.pill .ico{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--ink);color:#000;font:800 16px/1 var(--sans)}
.pill+.pill{margin-top:9px}
.wavebox{position:absolute;left:50%;top:22px;transform:translateX(-50%);text-align:center;width:300px}
.wavebox .t{font:800 30px/1.1 var(--sans);letter-spacing:.06em}
.wavebox .n{margin-top:5px;font:700 23px/1 var(--mono);color:var(--ink2)}
.timer{position:absolute;right:24px;top:96px;font:700 22px/1 var(--mono);color:var(--ink2)}
.xpwrap{position:absolute;left:24px;right:24px;top:146px}
.xpbar{height:11px;border-radius:999px;background:rgba(255,255,255,.13);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--coral);
  box-shadow:0 0 14px var(--coral);transition:width .18s linear}
.xplabel{display:flex;justify-content:space-between;margin-top:7px;
  font:600 21px/1 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.xplabel .mult{color:var(--coral)}

/* ── 하단 HUD ── */
.hud-bot{position:absolute;left:0;right:0;bottom:0;padding:0 24px 26px}
.bars{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:16px}
.bar{flex:1}
.bar .lab{font:700 22px/1 var(--mono);color:var(--ink2);margin-bottom:8px;
  font-variant-numeric:tabular-nums}
.bar .track{height:15px;background:rgba(255,255,255,.11);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;transition:width .15s linear}
.bar.hp .track i{background:var(--coral)}
.bar.sh{text-align:right}
.bar.sh .track i{background:var(--magenta);margin-left:auto}
.skillbox .cap{font:700 22px/1 var(--sans);color:var(--ink2);margin-bottom:10px;letter-spacing:.02em}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:8px;opacity:.28;transition:opacity .3s}
.srow.on{opacity:1}
.sico{width:38px;height:38px;flex:none;border-radius:9px;background:var(--card);
  border:1px solid var(--border);position:relative;display:grid;place-items:center}
.sico b{position:absolute;left:-3px;bottom:-5px;font:700 15px/1 var(--mono);color:#fff;
  background:rgba(0,0,0,.86);border-radius:5px;padding:2px 4px;letter-spacing:.01em}
.strack{flex:1;max-width:224px;height:34px;background:rgba(255,255,255,.15);
  border-radius:5px;position:relative;overflow:hidden}
.strack i{position:absolute;inset:0;width:0;background:#fff;transition:width .3s}
.sval{width:86px;flex:none;text-align:right;font:700 23px/1 var(--mono);color:#fff;
  font-variant-numeric:tabular-nums}

/* ── 상시 CTA 필 (페이크 광고 규격) ── */
#ctaPill{position:absolute;right:24px;top:196px;pointer-events:auto;cursor:pointer;
  display:flex;align-items:center;gap:9px;background:var(--coral);color:#fff;border:0;
  border-radius:999px;padding:22px 28px;font:700 26px/1 var(--sans);letter-spacing:-.01em;
  box-shadow:0 6px 26px rgba(232,80,42,.5);opacity:0;transform:translateY(-14px);
  transition:opacity .45s,transform .45s;font-family:var(--sans)}
#ctaPill.show{opacity:1;transform:none}
#ctaPill .arw{font-size:17px}
#ctaPill::after{content:'';position:absolute;inset:0;border-radius:999px;
  background:var(--coral);z-index:-1;opacity:0}
#ctaPill.show::after{animation:halo 2.2s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.55} 70%,100%{transform:scale(1.34);opacity:0}}

/* ── 레벨업 / 각성 토스트 ── */
#toast{position:absolute;left:50%;top:872px;transform:translate(-50%,10px);
  text-align:center;opacity:0;transition:opacity .3s,transform .3s;width:600px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .k{font:800 26px/1 var(--sans);color:var(--coral);letter-spacing:.14em;margin-bottom:11px}
#toast .v{display:inline-block;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:15px 28px;font:700 27px/1.35 var(--sans)}
#toast .v em{font-style:normal;color:var(--magenta)}

/* ── 결과(CLEAR) 카드 ── */
#end{position:absolute;inset:0;background:rgba(8,8,8,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 54px;opacity:0;pointer-events:none;transition:opacity .5s}
#end.show{opacity:1;pointer-events:auto}
#end .clr{font:800 78px/1 var(--sans);letter-spacing:.13em;
  text-shadow:0 0 44px rgba(232,80,42,.75)}
#end .rule{width:100%;height:1px;background:var(--border);margin:26px 0 30px}
#end .sub{font:700 21px/1 var(--sans);color:var(--ink2);margin-bottom:18px;letter-spacing:.05em}
#end .res{width:100%;display:flex;flex-direction:column;gap:9px;margin-bottom:32px}
#end .res .r{display:flex;align-items:center;gap:11px}
#end .loot{display:flex;gap:9px;border:2px solid var(--ink);border-radius:var(--radius);
  padding:16px 14px;margin-bottom:36px}
#end .loot div{width:76px;text-align:center}
#end .loot .g{font:700 30px/1 var(--sans);color:var(--ink)}
#end .loot .c{margin-top:8px;font:700 19px/1 var(--mono);color:var(--ink2)}
#end .btn{pointer-events:auto;cursor:pointer;border:0;width:100%;border-radius:var(--radius);
  padding:27px;font:800 33px/1 var(--sans);background:var(--coral);color:#fff;
  box-shadow:0 10px 40px rgba(232,80,42,.5);font-family:var(--sans);letter-spacing:-.01em}
#end .btn:active{transform:translateY(2px)}
#end .again{pointer-events:auto;cursor:pointer;margin-top:16px;background:none;border:0;
  color:var(--ink3);font:600 26px/1 var(--sans);font-family:var(--sans);padding:12px}
/* 결과창이 뜨면 인게임 HUD는 물러난다 — 같은 수치가 두 번 보이지 않게 */
#ui.ended .hud-top,#ui.ended .hud-bot,#ui.ended #ctaPill{opacity:0;transition:opacity .35s}
</style>
</head>
<body>

<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div class="hud-top">
      <div class="pill"><span class="ico">S</span><span id="coin">300</span></div><br>
      <div class="pill"><span class="ico">●</span><span id="gem">3k</span></div>
      <div class="wavebox"><div class="t">웨이브</div><div class="n"><span id="wv">1</span>/20</div></div>
      <div class="timer" id="clock">00:00</div>
      <div class="xpwrap">
        <div class="xpbar"><i id="xpfill"></i></div>
        <div class="xplabel"><span id="xplab">Lv.1/50 (0.0%)</span><span class="mult" id="mult">X1.0</span></div>
      </div>
    </div>

    <button id="ctaPill">이 게임이 궁금하다면?<span class="arw">▶</span></button>

    <div id="toast"><div class="k" id="tk">LEVEL UP</div><div class="v" id="tv"></div></div>

    <div class="hud-bot">
      <div class="bars">
        <div class="bar hp"><div class="lab">HP: <span id="hpn">1000</span>/1000</div>
          <div class="track"><i id="hpf" style="width:100%"></i></div></div>
        <div class="bar sh"><div class="lab">SHIELD: <span id="shn">100</span>/100</div>
          <div class="track"><i id="shf" style="width:100%"></i></div></div>
      </div>
      <div class="skillbox">
        <div class="cap">스킬 피해 현황</div>
        <div class="srow on" id="sr0"><span class="sico"><canvas width="38" height="38" id="si0"></canvas><b>Lv1</b></span>
          <span class="strack"><i id="sf0"></i></span><span class="sval" id="sv0">0</span></div>
        <div class="srow" id="sr1"><span class="sico"><canvas width="38" height="38" id="si1"></canvas><b>Lv0</b></span>
          <span class="strack"><i id="sf1"></i></span><span class="sval" id="sv1">–</span></div>
        <div class="srow" id="sr2"><span class="sico"><canvas width="38" height="38" id="si2"></canvas><b>Lv0</b></span>
          <span class="strack"><i id="sf2"></i></span><span class="sval" id="sv2">–</span></div>
      </div>
    </div>

    <div id="end">
      <div class="clr">CLEAR</div>
      <div class="rule"></div>
      <div class="sub">피해 현황</div>
      <div class="res" id="endres"></div>
      <div class="sub">전리품</div>
      <div class="loot" id="endloot"></div>
      <button class="btn" id="ctaMain">이 게임이 궁금하다면?</button>
      <button class="again" id="again">다시 보기</button>
    </div>
  </div>
</div></div>

<script>

        Stage(해상도 스케일 상수 1개) / Input(드래그 단일 조작) /
        Director(초 단위 타임라인) / RNG(시드) / 무입력 완주 / 결과·CTA
   ── 2층 : 게임 코어 (장르마다 교체)
        규칙 · 적 · 스킬 · 연출 · 보스
   외부 요청 0건. 단일 HTML.

/* ───────── 교체 슬롯 : 스토어 링크 ─────────
   넷마블 스토어 URL 수령 후 교체. 제작사 URL을 넣은 채로 내보내지 말 것. */
const CTA_URL = 'STORE_URL_HERE';   // ← 교체 필요

/* ───────── 1층 : Stage — 해상도 스케일 상수 1개 ───────── */
const BASE_W = 720, BASE_H = 1280;
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = 1;
function fit(){
  /* 전면 채우기(fill-rate)가 지배적이라 DPR을 1.5로 묶는다.
     실측(soft-raster 390x844): DPR2 = 11fps → DPR1 = 47fps. */
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = BASE_W * DPR; cv.height = BASE_H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const k = Math.min(innerWidth / BASE_W, innerHeight / BASE_H);
  stage.style.transform = 'scale(' + k + ')';
}
addEventListener('resize', fit); fit();

/* ───────── 1층 : 시드 RNG (재현 가능한 연출) ───────── */
let _seed = 20260909;
const rnd  = () => ((_seed = (_seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const rr   = (a,b) => a + rnd() * (b - a);
const TAU  = Math.PI * 2;
const clamp= (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;

/* ───────── 1층 : Input — 드래그 단일 조작 ───────── */
const input = { active:false, x:0, y:0, everTouched:false };
function toStage(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / (r.width / BASE_W),
           y:(e.clientY - r.top)  / (r.height/ BASE_H) };
}
function down(e){ input.active = true; input.everTouched = true; move(e); }
function move(e){ if(!input.active) return; const p = toStage(e); input.x = p.x; input.y = p.y; }
function up(){ input.active = false; }
cv.addEventListener('pointerdown', down);
addEventListener('pointermove', move);
addEventListener('pointerup', up);
addEventListener('pointercancel', up);

/* ───────── 1층 : Director — 초 단위 타임라인 ─────────
   타임라인이 상태를 지배한다. 게임 조건이 길이를 지배하지 않는다. */
const T = {
  TUTORIAL : 4.0,    // 0~4    조작 시연
  RISE     : 4.0,    // 4~12   상승
  LV_BOLT  : 7.0,    //        섬광 해금
  LV_NOVA  : 13.0,   //        노바 해금
  PRESSURE :12.0,    // 12~19  긴장 최고조 (몹 물량 최대)
  BOSS     :19.5,    // 19.5   보스 등장
  AWAKEN   :21.8,    // 21.8   각성 → 압도적 해소
  CLEAR    :27.4,    // 27.4   결과 + CTA (종료 ≈28초)
  PILL     :6.0      //        상시 CTA 노출
};

let S, raf = 0, lastT = 0, hudAcc = 0;

function reset(){
  _seed = 20260909;
  S = {
    t:0, phase:'play', ended:false,
    hp:1000, hpMax:1000, hpFloor:170,      // ← 무패 장치 : HP 하한 클램프
    shield:100, shMax:100,
    combo:0, comboPulse:0, wave:1,
    level:1, xp:0, xpNeed:5, mult:1,
    enemies:[], bullets:[], fx:[], pops:[], bolts:[],
    heroAng:-Math.PI/2, heroTarget:-Math.PI/2, fireCd:0,
    skills: SKILLS.map((s,i) => ({ ...s, lv: i===0?1:0, dmg:0, on: i===0 })),
    boss:null, awakened:false, shake:0, flash:0, spawnAcc:0,
    hitstop:0, timeScale:1, zoom:1, burst:0, animT:0,
    kills:0, hintAng:-Math.PI/2, killPunchCd:0, comboTier:0
  };
  /* 주목도가 가장 높은 0~2초가 빈 화면이 되지 않게 미리 날아오는 적을 심는다 */
  for (let i=0;i<9;i++){ spawnEnemy(); S.enemies[i].r = rr(300, 620); }
  document.getElementById('end').classList.remove('show');
  document.getElementById('ui').classList.remove('ended');
  document.getElementById('ctaPill').classList.remove('show');
  document.getElementById('toast').classList.remove('show');
  hudAcc = 1; lastT = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

/* ───────── 2층 : 적 생성 곡선 (타임라인이 지배) ───────── */
function spawnRate(t){
  if (t < T.TUTORIAL)  return 1.1;
  if (t < T.PRESSURE)  return lerp(2.6, 9.5, (t - T.TUTORIAL)/(T.PRESSURE - T.TUTORIAL));
  if (t < T.BOSS)      return lerp(13.0, 21.0, (t - T.PRESSURE)/(T.BOSS - T.PRESSURE));
  if (t < T.BOSS + 0.6) return 0;      // 보스 등장 0.6초는 무대를 비운다
  if (t < T.AWAKEN)    return 13.0;
  return 0;
}
function spawnEnemy(){
  const t = S.t;
  const a = rnd() * TAU;
  let kind = 'ring';
  if (t > 5  && rnd() < .34) kind = 'shard';
  if (t > 11 && rnd() < .20) kind = 'heavy';
  const base = { ring:{hp:34,r:15,sp:96}, shard:{hp:60,r:15,sp:116}, heavy:{hp:165,r:24,sp:70} }[kind];
  const grow = 1 + t * 0.14;
  S.enemies.push({
    kind, a, r:SPAWN_R + rr(0,90),
    hp: base.hp*grow, hpMax: base.hp*grow, rad: base.r,
    sp: base.sp * rr(.9,1.12), rot: rnd()*TAU, phase: rnd()*TAU, hitFx:0
  });
}

/* ───────── 2층 : 데미지 ───────── */
function hurt(e, dmg, skillIdx){
  e.hp -= dmg; e.hitFx = 1;
  S.skills[skillIdx].dmg += Math.round(dmg);
  if (e.hp <= 0) kill(e);
}
function kill(e){
  e.dead = true;
  S.kills++; S.combo++; S.comboPulse = 1;
  /* 초당 수십 킬 구간에서 상시 흔들림이 되지 않도록 쿨다운을 건다 */
  if (S.killPunchCd <= 0){
    const big = e.kind === 'heavy';
    punch(big ? 6 : 3.2, big ? 1.014 : 1.006, big ? 0.03 : 0.015, 0, 0);
    S.killPunchCd = big ? 0.10 : 0.16;
  }
  /* 콤보 계단 — 50/100/200 돌파를 사건으로 */
  const tier = S.combo >= 200 ? 3 : S.combo >= 100 ? 2 : S.combo >= 50 ? 1 : 0;
  if (tier > S.comboTier){ S.comboTier = tier; punch(10, 1.025, 0.05, 0, 0); }
  S.xp += 1;
  const p = polar(e.a, e.r);
  boom(p.x, p.y, e.kind === 'heavy' ? 22 : 13, e.kind === 'shard');
  if (S.xp >= S.xpNeed){
    S.xp = 0; S.level++;
    S.xpNeed = Math.round(S.xpNeed * 1.11);
    S.mult = 1 + S.level * 0.05;
  }
}
function polar(a, r){ return { x: CX + Math.cos(a)*r, y: CY + Math.sin(a)*r }; }

/* 타격 연출 한 묶음 — 흔들림 / 줌 펀치 / 히트스톱 / 슬로모 / 플래시.
   광고 길이(S.t)는 실시간으로 흐르므로 슬로모를 걸어도 28초는 그대로다. */
function punch(shake, zoom, hitstop, slowmo, flash){
  S.shake     = Math.max(S.shake, shake);
  S.zoom      = Math.max(S.zoom, zoom);
  S.hitstop   = Math.max(S.hitstop, hitstop);
  if (slowmo) S.timeScale = Math.min(S.timeScale, slowmo);
  if (flash)  S.flash = Math.max(S.flash, flash);
}

function boom(x, y, n, magenta){
  for (let i=0;i<n;i++){
    const a = rnd()*TAU, sp = rr(60,300);
    S.fx.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, max:rr(.32,.62),
                r:rr(1.6,4), m:!!magenta });
  }
  S.fx.push({ ring:true, x, y, life:1, max:.34, r0:6, r1:n*2.6, m:!!magenta });
}
function pop(x, y, v){
  if (S.pops.length > 7) return;            // 화면이 숫자로 덮이지 않게
  S.pops.push({ x: x + rr(-16,16), y: y + rr(-12,12), v, life:1 });
}

/* ───────── 2층 : 스킬 ───────── */
function fireCore(dt){
  const sk = S.skills[0];
  const rate = S.awakened ? 0.035 : lerp(0.115, 0.062, clamp((sk.lv-1)/4,0,1));
  S.fireCd -= dt;
  while (S.fireCd <= 0){
    S.fireCd += rate;
    const p = polar(S.heroAng, 58);   // 중앙 캐릭터 총구 부근
    const spread = S.awakened ? 3 : (sk.lv >= 3 ? 2 : 1);
    for (let i=0;i<spread;i++){
      const off = (i - (spread-1)/2) * 0.13;
      S.bullets.push({ x:p.x, y:p.y, a:S.heroAng + off, sp:660,
                       dmg: 26 * S.mult * (1 + (sk.lv-1)*0.4), life:1.5 });
    }
  }
}
function fireBolt(dt){
  const sk = S.skills[1]; if (!sk.on) return;
  sk.cd = (sk.cd || 0) - dt;
  if (sk.cd > 0) return;
  sk.cd = S.awakened ? 0.26 : lerp(0.95, 0.5, clamp((sk.lv-1)/4,0,1));
  const live = S.enemies.filter(e => !e.dead && e.r < SPAWN_R - 40);
  if (!live.length && !S.boss) return;
  const chain = S.awakened ? 9 : 3 + sk.lv;
  const pts = [{ x:CX, y:CY }];
  let pool = live.slice().sort((a,b)=>a.r-b.r).slice(0, chain);
  pool.forEach(e => {
    const p = polar(e.a, e.r); pts.push(p);
    hurt(e, 46 * S.mult * (1 + (sk.lv-1)*0.5), 1);
  });
  if (S.boss){
    pts.push({ x:S.boss.x, y:S.boss.y });
    bossHurt(78 * S.mult * (1 + sk.lv*0.5), 1);
  }
  if (pts.length > 1) S.bolts.push({ pts, life:1 });
}
function fireNova(dt){
  const sk = S.skills[2]; if (!sk.on) return;
  sk.cd = (sk.cd || 0) - dt;
  if (sk.cd > 0) return;
  sk.cd = S.awakened ? 0.7 : lerp(2.4, 1.5, clamp((sk.lv-1)/4,0,1));
  const dmg = 120 * S.mult * (1 + (sk.lv-1)*0.55);
  S.fx.push({ nova:true, life:1, max:.34, r0:CORE_R, r1: S.awakened ? 760 : 470 });
  const reach = S.awakened ? 700 : 420;
  S.enemies.forEach(e => { if (!e.dead && e.r < reach) hurt(e, dmg, 2); });
  if (S.boss) bossHurt(dmg * 1.4, 2);
  punch(S.awakened ? 17 : 11, S.awakened ? 1.055 : 1.03,
        S.awakened ? 0.05 : 0.038, 0, 0);
}

/* ───────── 2층 : 보스 ───────── */
function spawnBoss(){
  S.boss = { x: CX + 186, y: CY - 170, hp:7600, hpMax:7600, rot:0, hitFx:0, t:0 };
  punch(22, 1.09, 0.15, 0.42, 0.7);
  S.fx.push({ nova:true, life:1, max:.5, r0:420, r1:150 });   // 수축 링 = 등장
}
function bossHurt(d, i){
  if (!S.boss || S.boss.dead) return;
  S.boss.hp -= d; S.boss.hitFx = 1;
  S.skills[i].dmg += Math.round(d);
  if (S.boss.hp <= 0){
    S.boss.dead = true; S.combo += 40;
    const bx = S.boss.x, by = S.boss.y, gen = S;
    for (let k=0;k<5;k++)
      setTimeout(() => { if (S === gen) boom(bx + rr(-70,70), by + rr(-70,70), 30, k%2===0); }, k*90);
    punch(26, 1.10, 0.16, 0.38, 1);
  }
}

/* ───────── 1층 : Director + 2층 업데이트 ───────── */
function update(dtRaw, real){
  /* 타임라인은 실경과시간으로 전진한다 — 저사양에서 프레임이 떨어져도
     광고 길이(28초)가 늘어나지 않게. 물리만 dt 캡을 쓴다. */
  S.t += Math.min(real, 0.25);
  const t = S.t;

  /* 연출 감쇠는 실시간(rdt), 게임 물리는 히트스톱·슬로모가 걸린 dt */
  const rdt = dtRaw;
  S.hitstop   = Math.max(0, S.hitstop - rdt);
  S.killPunchCd = Math.max(0, S.killPunchCd - rdt);
  S.timeScale += (1 - S.timeScale) * Math.min(1, rdt * 2.6);
  S.zoom      += (1 - S.zoom)      * Math.min(1, rdt * 5.5);
  S.burst      = Math.max(0, S.burst - rdt);
  const dt = S.hitstop > 0 ? 0 : dtRaw * S.timeScale;

  /* 웨이브 표기 : 타임라인에 종속 (게임 조건 아님) */
  S.wave = clamp(Math.floor(Math.pow(clamp(t / T.BOSS,0,1), 1.6) * 19) + 1, 1, 20);

  /* 타임라인 비트 */
  if (t >= T.LV_BOLT && !S.skills[1].on){
    S.skills[1].on = true; S.skills[1].lv = 1;
    toast('LEVEL UP', '<em>섬광</em> 해금 — 적을 타고 흐르는 연쇄 번개');
  }
  if (t >= T.LV_NOVA && !S.skills[2].on){
    S.skills[2].on = true; S.skills[2].lv = 1;
    S.skills[0].lv = 3; S.skills[1].lv = 2;
    toast('LEVEL UP', '<em>노바</em> 해금 — 궤도를 따라 터지는 충격파');
  }
  if (t >= T.BOSS && !S.boss) spawnBoss();
  if (t >= T.AWAKEN && !S.awakened){
    S.awakened = true;
    S.skills.forEach(s => { s.on = true; s.lv = 5; });
    S.mult = Math.max(S.mult, 3.2);
    /* 멘트 없이 연출로만 : 화면 정지 → 슬로모 → 강한 흔들림 + 줌 + 방사선 */
    punch(30, 1.13, 0.14, 0.30, 1);
    S.burst = 0.85;
    S.fx.push({ nova:true, life:1, max:.55, r0:CORE_R, r1:820 });
  }
  if (t >= T.PILL) document.getElementById('ctaPill').classList.add('show');
  if (t >= T.CLEAR && !S.ended){ S.ended = true; showEnd(); }

  /* 긴장 곡선 : SHIELD가 먼저 마르고 HP가 깎인다.
     충돌은 여기서 더 깊게만 팔 수 있고 회복은 없다. 하한은 hpFloor. */
  const shTarget = t < 7.5 ? 100 : clamp(100 - (t - 7.5) / 4.6 * 100, 0, 100);
  const hpTarget = t < 11.5 ? 1000
                 : Math.max(S.hpFloor + 470, 1000 - (t - 11.5) / 10.5 * 360);
  S.shield = Math.min(S.shield, shTarget);
  S.hp     = Math.max(S.hpFloor, Math.min(S.hp, hpTarget));

  /* 조작 : 드래그로 히어로를 궤도 위에서 선회 —
     무입력이면 가장 가까운 적으로 자동 선회(오토플레이 완주 보장) */
  if (input.active){
    S.heroTarget = Math.atan2(input.y - CY, input.x - CX);
  } else {
    let best = null, bd = 1e9;
    S.enemies.forEach(e => { if (!e.dead && e.r < bd){ bd = e.r; best = e; } });
    if (best) S.heroTarget = best.a;
    else if (S.boss && !S.boss.dead) S.heroTarget = Math.atan2(S.boss.y - CY, S.boss.x - CX);
  }
  let d = ((S.heroTarget - S.heroAng + Math.PI*3) % TAU) - Math.PI;
  S.heroAng += clamp(d, -9*dt, 9*dt);

  /* 손 가이드 — 조준을 앞서가는 유도점 (독립 각도면 조작을 잘못 가르친다) */
  S.hintAng = S.heroAng + 0.95;

  /* 스폰 */
  S.spawnAcc += spawnRate(t) * dt;
  while (S.spawnAcc >= 1){
    S.spawnAcc -= 1;
    if (S.enemies.length < 74) spawnEnemy();   // 상한 : 밀도 유지 + 프레임 방어
  }

  S.animT += dt;

  /* 스킬 */
  fireCore(dt); fireBolt(dt); fireNova(dt);

  /* 적 위치 1회 산출 — 총알 유도/충돌이 같은 좌표를 본다 */
  S.enemies.forEach(e => { const p = polar(e.a, e.r); e.px = p.x; e.py = p.y; });

  /* 총알 */
  S.bullets.forEach(b => {
    /* 약한 유도 : 무패 구조를 위해 명중을 보장 */
    let best = null, bd = 1e9;
    S.enemies.forEach(e => {
      if (e.dead) return;
      const da = Math.abs(((Math.atan2(e.py-b.y, e.px-b.x) - b.a + Math.PI*3) % TAU) - Math.PI);
      if (da < 0.5){
        const dd = Math.hypot(e.px-b.x, e.py-b.y);
        if (dd < bd){ bd = dd; best = { x:e.px, y:e.py }; }
      }
    });
    if (best){
      const want = Math.atan2(best.y - b.y, best.x - b.x);
      let dd = ((want - b.a + Math.PI*3) % TAU) - Math.PI;
      b.a += clamp(dd, -4*dt, 4*dt);
    }
    b.x += Math.cos(b.a) * b.sp * dt;
    b.y += Math.sin(b.a) * b.sp * dt;
    b.life -= dt;
    if (b.x < -60 || b.x > BASE_W+60 || b.y < -60 || b.y > BASE_H+60) b.life = 0;
  });

  /* 적 이동 + 충돌 */
  S.enemies.forEach(e => {
    if (e.dead) return;
    e.r -= e.sp * dt;
    e.a += Math.sin(S.t*0.7 + e.phase) * 0.14 * dt;
    e.rot += dt * 1.8;
    e.hitFx = Math.max(0, e.hitFx - dt*4);
    const p = polar(e.a, e.r);

    for (const b of S.bullets){
      if (b.life <= 0) continue;
      if (Math.hypot(b.x-p.x, b.y-p.y) < e.rad + 8){
        b.life = 0;
        hurt(e, b.dmg, 0);
        if (e.dead) pop(p.x, p.y, Math.round(b.dmg));
        break;
      }
    }
    /* 코어 접촉 : HP 감소 — 하한 클램프로 절대 패배하지 않음 */
    if (!e.dead && e.r <= CORE_R + e.rad){
      e.dead = true;
      const dmg = e.kind === 'heavy' ? 34 : 19;
      if (S.shield > 0) S.shield = Math.max(0, S.shield - dmg);
      else S.hp = Math.max(S.hpFloor, S.hp - dmg);   // ← 무패 : 절대 hpFloor 아래로 안 감
      S.combo = 0; punch(7, 1.012, 0.02, 0, 0);
      boom(p.x, p.y, 8, false);
    }
  });

  /* 보스 */
  if (S.boss && !S.boss.dead){
    const b = S.boss; b.t += dt; b.rot += dt * 0.55;
    b.hitFx = Math.max(0, b.hitFx - dt*3);
    b.x = CX + 186 + Math.sin(b.t*0.8) * 34;
    b.y = CY - 170 + Math.cos(b.t*0.6) * 22;
    for (const bu of S.bullets){
      if (bu.life <= 0) continue;
      if (Math.hypot(bu.x-b.x, bu.y-b.y) < 74){ bu.life = 0; bossHurt(bu.dmg, 0); }
    }
  }

  /* 정리 & 파티클 */
  S.enemies = S.enemies.filter(e => !e.dead && e.r > -40);
  S.bullets = S.bullets.filter(b => b.life > 0);
  S.fx.forEach(f => {
    f.life -= dt / f.max;
    if (!f.ring && !f.nova){ f.x += f.vx*dt; f.y += f.vy*dt; f.vx *= .94; f.vy *= .94; }
  });
  S.fx = S.fx.filter(f => f.life > 0);
  S.bolts.forEach(b => b.life -= dt * 5.5);
  S.bolts = S.bolts.filter(b => b.life > 0);
  S.pops.forEach(p => { p.life -= dt * 1.5; p.y -= dt * 42; });
  S.pops = S.pops.filter(p => p.life > 0);

  S.comboPulse = Math.max(0, S.comboPulse - rdt*3.2);
  S.shake = Math.max(0, S.shake - rdt*34);
  S.flash = Math.max(0, S.flash - rdt*2.4);

  hudAcc += rdt;
  if (hudAcc >= 0.1){ hudAcc = 0; syncHUD(); }
}

/* ───────── 렌더 ───────── */
/* 정적 레이어는 1회만 만든다 — 매 프레임 생성은 물량 구간에서 프레임을 깎는다 */
const G = {};
function buildCache(){
  G.core = ctx.createRadialGradient(CX, CY, 4, CX, CY, 160);
  G.core.addColorStop(0,'rgba(232,80,42,.55)');
  G.core.addColorStop(.5,'rgba(232,80,42,.14)');
  G.core.addColorStop(1,'rgba(232,80,42,0)');

  G.danger = ctx.createRadialGradient(CX, CY, 300, CX, CY, 780);
  G.danger.addColorStop(0,'rgba(232,80,42,0)');
  G.danger.addColorStop(1,'rgba(232,80,42,1)');

  G.top = ctx.createLinearGradient(0,0,0,300);
  G.top.addColorStop(0,'rgba(17,17,17,.88)'); G.top.addColorStop(1,'rgba(17,17,17,0)');
  G.bot = ctx.createLinearGradient(0,BASE_H,0,BASE_H-320);
  G.bot.addColorStop(0,'rgba(17,17,17,.92)'); G.bot.addColorStop(1,'rgba(17,17,17,0)');

  G.hero = ctx.createRadialGradient(0,0,2,0,0,52);
  G.hero.addColorStop(0,'rgba(232,80,42,.62)'); G.hero.addColorStop(1,'rgba(232,80,42,0)');
  G.boss = ctx.createRadialGradient(0,0,10,0,0,150);
  G.boss.addColorStop(0,'rgba(232,80,42,.55)'); G.boss.addColorStop(1,'rgba(232,80,42,0)');

  /* 배경 + 성운 + 별밭은 변하지 않는다 → 한 장으로 구워 매 프레임 1회만 blit.
     (셰이크 여백 40px 포함)                                              */
  const M = 40;
  G.sky = document.createElement('canvas');
  G.sky.width = BASE_W + M*2; G.sky.height = BASE_H + M*2;
  const k = G.sky.getContext('2d');
  k.fillStyle = '#111111'; k.fillRect(0,0,G.sky.width,G.sky.height);
  k.translate(M, M);
  const nb = k.createRadialGradient(CX, CY, 40, CX, CY, 560);
  nb.addColorStop(0,'rgba(232,80,42,.11)');
  nb.addColorStop(.45,'rgba(183,65,154,.05)');
  nb.addColorStop(1,'rgba(0,0,0,0)');
  k.fillStyle = nb; k.fillRect(0,0,BASE_W,BASE_H);
  for (let i=0;i<150;i++){
    k.globalAlpha = rr(.15,.85); k.fillStyle = '#fff';
    k.beginPath(); k.arc(rnd()*BASE_W, rnd()*BASE_H, rr(.5,1.9), 0, TAU); k.fill();
  }
}
buildCache();

function draw(){
  ctx.save();
  if (S.zoom > 1.001){                     // 줌 펀치 — 중심 기준
    ctx.translate(CX, CY); ctx.scale(S.zoom, S.zoom); ctx.translate(-CX, -CY);
  }
  if (S.shake > 0.2) ctx.translate(rr(-S.shake,S.shake)*.5, rr(-S.shake,S.shake)*.5);

  /* 배경 — 구워둔 한 장 (전면 채우기 3회 → 1회) */
  ctx.drawImage(G.sky, -40, -40);

  /* 위험 비네트 (긴장 최고조 구간) */
  const danger = clamp((S.t - T.PRESSURE) / 5, 0, 1) * (1 - clamp((S.t - T.AWAKEN)/0.7, 0, 1))
               * (1 - S.hp/S.hpMax + .35);
  if (danger > 0.02){
    ctx.globalAlpha = danger * .42;
    ctx.fillStyle = G.danger; ctx.fillRect(0,0,BASE_W,BASE_H);
    ctx.globalAlpha = 1;
  }

  /* 점선 궤도 */
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.30)';
  ctx.lineWidth = 2.4; ctx.setLineDash([13,15]);
  ctx.lineDashOffset = -S.t * 16;
  ctx.beginPath(); ctx.arc(CX, CY, RING, 0, TAU); ctx.stroke();
  ctx.restore();

  /* 노바 링 */
  S.fx.forEach(f => {
    if (!f.nova) return;
    const p = 1 - f.life;
    ctx.strokeStyle = 'rgba(232,80,42,'+(f.life*f.life*.9)+')';
    ctx.lineWidth = 7 * f.life + 1.5;
    ctx.shadowColor = '#E8502A'; ctx.shadowBlur = 20*f.life;
    ctx.beginPath(); ctx.arc(CX, CY, lerp(f.r0,f.r1,p*p*0.6+p*0.4), 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
  });

  /* 코어 */
  ctx.fillStyle = G.core; ctx.beginPath(); ctx.arc(CX, CY, 160, 0, TAU); ctx.fill();
  if (!heroReady) drawCore(CX, CY, S.t);      // 에셋 미도착 시에만 기하 코어

  /* 적 */
  S.enemies.forEach(e => {
    const p = polar(e.a, e.r);
    drawEnemy(e, p.x, p.y);
  });

  /* 보스 */
  if (S.boss && !S.boss.dead) drawBoss(S.boss);

  /* 번개 */
  S.bolts.forEach(b => {
    ctx.strokeStyle = 'rgba(183,65,154,'+clamp(b.life,0,1)+')';
    ctx.shadowColor = '#b7419a'; ctx.shadowBlur = 22;
    ctx.lineWidth = 4.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    b.pts.forEach((p, i) => {
      if (i === 0){ ctx.moveTo(p.x, p.y); return; }
      const q = b.pts[i-1];
      const mx = (p.x+q.x)/2 + rr(-24,24), my = (p.y+q.y)/2 + rr(-24,24);
      ctx.lineTo(mx, my); ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,'+clamp(b.life*.9,0,1)+')';
    ctx.lineWidth = 1.6; ctx.stroke();
    ctx.shadowBlur = 0;
  });

  /* 총알 — 흰 물방울형 */
  S.bullets.forEach(b => {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a + Math.PI/2);
    ctx.fillStyle = 'rgba(232,80,42,.42)';        // 발광 대체 : 넓고 옅은 1패스
    ctx.beginPath();
    ctx.moveTo(0,-17); ctx.quadraticCurveTo(10,0, 0,12); ctx.quadraticCurveTo(-10,0, 0,-17);
    ctx.fill();
    ctx.fillStyle = '#fff';                        // 본체
    ctx.beginPath();
    ctx.moveTo(0,-13); ctx.quadraticCurveTo(6,0, 0,8); ctx.quadraticCurveTo(-6,0, 0,-13);
    ctx.fill(); ctx.restore();
  });

  /* 조준 마커 — 드래그가 어디를 겨누는지 궤도 위에 표시 */
  const am = polar(S.heroAng, RING);
  ctx.save(); ctx.translate(am.x, am.y); ctx.rotate(S.heroAng);
  ctx.strokeStyle = 'rgba(232,80,42,.95)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9,-13); ctx.lineTo(11,0); ctx.lineTo(-9,13); ctx.stroke();
  ctx.restore();

  /* 중앙 캐릭터 (고객사 IP 슬롯) */
  drawHero(CX, CY, S.heroAng);

  /* 파티클 */
  S.fx.forEach(f => {
    if (f.nova) return;
    if (f.ring){
      ctx.strokeStyle = (f.m ? 'rgba(183,65,154,' : 'rgba(255,255,255,') + f.life*.8 + ')';
      ctx.lineWidth = 3.2 * f.life + .6;
      ctx.beginPath(); ctx.arc(f.x, f.y, lerp(f.r0,f.r1,1-f.life), 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = (f.m ? 'rgba(183,65,154,' : 'rgba(255,255,255,') + f.life + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r*f.life, 0, TAU); ctx.fill();
    }
  });

  if (S.boss && !S.boss.dead) drawBossBar(S.boss);

  /* HUD 가독성 스크림 */
  ctx.fillStyle = G.top; ctx.fillRect(0,0,BASE_W,300);
  ctx.fillStyle = G.bot; ctx.fillRect(0,BASE_H-320,BASE_W,320);

  /* 데미지 팝업 */
  ctx.textAlign = 'center';
  S.pops.forEach(p => {
    if (p.y < 396 || p.y > 1024) return;      // 상·하단 HUD·콤보 침범 방지
    ctx.globalAlpha = clamp(p.life,0,1);
    ctx.font = '700 27px ' + MONO;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 4;
    ctx.strokeText('-'+p.v, p.x, p.y); ctx.fillText('-'+p.v, p.x, p.y);
  });
  ctx.globalAlpha = 1;

  /* 콤보 */
  if (S.combo > 1){
    const s = 1 + S.comboPulse*0.13;
    ctx.save(); ctx.translate(CX, 378); ctx.scale(s,s);
    ctx.font = '800 ' + [34,40,45,50][S.comboTier] + 'px ' + SANS;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(232,80,42,.95)';
    ctx.shadowBlur = [18,25,32,40][S.comboTier];
    ctx.fillText('Combo ' + S.combo + '!!', 0, 0);
    ctx.restore(); ctx.shadowBlur = 0;
  }

  /* 손 가이드 (튜토리얼, 미조작 시) */
  if (S.t < T.TUTORIAL && !input.everTouched){
    const h = polar(S.hintAng, RING);
    /* 현재 조준 → 유도점까지의 호 = "이만큼 끌어라" */
    ctx.save();
    ctx.globalAlpha = .40; ctx.strokeStyle = '#E8502A'; ctx.lineWidth = 4;
    ctx.setLineDash([8,10]);
    ctx.beginPath(); ctx.arc(CX, CY, RING, S.heroAng, S.hintAng); ctx.stroke();
    ctx.restore();
    /* 손가락 : 코랄 채움 + 흰 테두리 → 흰 빈 링(적)과 색·형태 모두 다름 */
    const pulse = 24 + 10 * (0.5 + 0.5*Math.sin(S.t*5));
    ctx.save();
    ctx.globalAlpha = .35; ctx.strokeStyle = '#E8502A'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(h.x, h.y, pulse, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#E8502A';
    ctx.beginPath(); ctx.arc(h.x, h.y, 17, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(h.x, h.y, 17, 0, TAU); ctx.stroke();
    ctx.restore();
    /* 카피 — 하단 HUD와 이격 */
    ctx.textAlign = 'center';
    ctx.font = '700 30px ' + SANS;
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 6;
    ctx.strokeText('드래그해서 조준하세요', CX, CY + RING + 96);
    ctx.fillText('드래그해서 조준하세요', CX, CY + RING + 96);
  }

  /* 각성 방사선 — 중심에서 터져나가는 속도선 */
  if (S.burst > 0.01){
    const b = S.burst / 0.85;
    ctx.save(); ctx.globalAlpha = b * .55;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    for (let i=0;i<26;i++){
      const a = i/26*TAU + S.t*0.35;
      const r0 = lerp(90, 520, 1-b), r1 = r0 + lerp(40, 210, 1-b);
      ctx.beginPath();
      ctx.moveTo(CX+Math.cos(a)*r0, CY+Math.sin(a)*r0);
      ctx.lineTo(CX+Math.cos(a)*r1, CY+Math.sin(a)*r1);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 각성 플래시 */
  if (S.flash > 0.01){
    ctx.fillStyle = 'rgba(255,255,255,' + (S.flash*.62) + ')';
    ctx.fillRect(0,0,BASE_W,BASE_H);
  }
  ctx.restore();
}

const SANS = "'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif";
const MONO = "'JetBrains Mono','Fira Mono',monospace";

function drawCore(x, y, t){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = '#0d0d0d';
  ctx.beginPath(); ctx.arc(0,0,CORE_R,0,TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(232,80,42,.85)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0,0,CORE_R,0,TAU); ctx.stroke();
  ctx.rotate(t*0.35);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0,CORE_R-11,0.5,4.2); ctx.stroke();
  ctx.rotate(-t*0.8);
  ctx.strokeStyle = 'rgba(183,65,154,.8)'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i=0;i<4;i++){ const a=i/4*TAU; const p=Math.cos(a)*17, q=Math.sin(a)*17;
    i ? ctx.lineTo(p,q) : ctx.moveTo(p,q); }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

const heroFrames = (CHARACTER.frames || []).map(src => { const i = new Image(); i.src = src; return i; });
let heroReady = false;
if (heroFrames.length){
  let n = 0;
  heroFrames.forEach(i => i.onload = () => { if (++n === heroFrames.length) heroReady = true; });
}

function drawHero(x, y, a){
  ctx.save(); ctx.translate(x,y);

  if (heroReady){
    const im = heroFrames[Math.floor(S.animT * CHARACTER.fps) % heroFrames.length];
    const w = CHARACTER.w, h = w * (im.height / im.width);
    /* 발밑 그림자 — 중앙에 '서 있다'는 접지감 */
    ctx.save();
    ctx.scale(1, 0.34); ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.arc(0, (h*0.40)/0.34, w*0.30, 0, TAU); ctx.fill();
    ctx.restore();
    /* 조준이 왼쪽이면 좌우 반전 (픽셀아트 회전 금지) */
    if (Math.cos(a) < 0) ctx.scale(-1, 1);
    ctx.imageSmoothingEnabled = false;          // 픽셀 뭉개짐 방지
    ctx.drawImage(im, -w*0.42, -h*0.52, w, h);
    ctx.imageSmoothingEnabled = true;
    ctx.restore();
    return;
  }

  ctx.rotate(a + Math.PI/2);
  ctx.fillStyle = G.hero; ctx.beginPath(); ctx.arc(0,0,52,0,TAU); ctx.fill();
  {
    /* 임시 도형 — 방패형 코어 가디언. 고객사 캐릭터 아트 도착 시 통째로 교체된다.
       (CHARACTER.image 만 채우면 이 블록은 실행되지 않음)                        */
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#E8502A'; ctx.lineWidth = 4;
    ctx.beginPath();                       // 방패 실루엣
    ctx.moveTo(0,-34); ctx.lineTo(25,-20); ctx.lineTo(25,12);
    ctx.quadraticCurveTo(25,34, 0,42);
    ctx.quadraticCurveTo(-25,34, -25,12); ctx.lineTo(-25,-20);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111';                // 문장(crest)
    ctx.beginPath();
    ctx.moveTo(0,-19); ctx.lineTo(12,-2); ctx.lineTo(0,26); ctx.lineTo(-12,-2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#E8502A';
    ctx.beginPath(); ctx.arc(0,-2,4.5,0,TAU); ctx.fill();
    ctx.strokeStyle = '#b7419a'; ctx.lineWidth = 3;   // 총구 방향 표식
    ctx.beginPath(); ctx.moveTo(0,-46); ctx.lineTo(0,-34); ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e, x, y){
  ctx.save(); ctx.translate(x,y); ctx.rotate(e.rot);
  const glow = 0.5 + 0.5*Math.sin(S.t*3 + e.phase);
  if (e.hitFx > 0){ ctx.globalAlpha = 1; ctx.shadowColor = '#fff'; ctx.shadowBlur = 22 * e.hitFx; }
  if (e.kind === 'ring'){
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.13 + glow*0.10) + ')';
    ctx.lineWidth = 11;
    ctx.beginPath(); ctx.arc(0,0,e.rad,0,TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.82 + glow*0.18) + ')';
    ctx.lineWidth = 3.8;
    ctx.beginPath(); ctx.arc(0,0,e.rad,0,TAU); ctx.stroke();
  } else if (e.kind === 'shard'){
    ctx.fillStyle = 'rgba(183,65,154,.95)';
    ctx.beginPath();
    ctx.moveTo(0,-e.rad); ctx.lineTo(e.rad*.72,0); ctx.lineTo(0,e.rad); ctx.lineTo(-e.rad*.72,0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6; ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3.6;
    ctx.beginPath();
    for (let i=0;i<6;i++){ const a=i/6*TAU; const p=Math.cos(a)*e.rad, q=Math.sin(a)*e.rad;
      i ? ctx.lineTo(p,q) : ctx.moveTo(p,q); }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(232,80,42,.30)'; ctx.fill();
  }
  ctx.restore(); ctx.shadowBlur = 0;
}

function drawBoss(b){
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = G.boss; ctx.beginPath(); ctx.arc(0,0,150,0,TAU); ctx.fill();
  ctx.save(); ctx.rotate(b.rot);
  if (b.hitFx > 0){ ctx.shadowColor='#fff'; ctx.shadowBlur = 30*b.hitFx; }
  for (let i=0;i<8;i++){
    ctx.save(); ctx.rotate(i/8*TAU);
    ctx.fillStyle = i%2 ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.68)';
    ctx.beginPath();
    ctx.moveTo(0,-22); ctx.quadraticCurveTo(40,-58, 0,-78); ctx.quadraticCurveTo(-40,-58, 0,-22);
    ctx.fill(); ctx.restore();
  }
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0,0,26,0,TAU); ctx.fill();
  ctx.strokeStyle = '#E8502A'; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.arc(0,0,26,0,TAU); ctx.stroke();
  ctx.restore(); ctx.shadowBlur = 0;
  ctx.restore();
}

/* 보스 HP 바는 파티클·총알보다 위에 그린다 (관통 방지) */
function drawBossBar(b){
  const w = 430, h = 17, x = CX - w/2, y = 300, r = clamp(b.hp/b.hpMax,0,1);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.82)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#E8502A';         ctx.fillRect(x, y, w*r, h);
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  ctx.textAlign = 'left';
  ctx.font = '800 20px ' + SANS; ctx.fillStyle = '#fff';
  ctx.fillText('BOSS', x, y - 10);
  ctx.textAlign = 'right';
  ctx.font = '700 20px ' + MONO;
  ctx.fillText(Math.round(r*100) + '%', x + w, y - 10);
  /* 보스 본체와 배너를 잇는 지시선 */
  ctx.globalAlpha = .30; ctx.strokeStyle = '#E8502A'; ctx.lineWidth = 2;
  ctx.setLineDash([5,7]);
  ctx.beginPath(); ctx.moveTo(x + w, y + h); ctx.lineTo(b.x, b.y - 70); ctx.stroke();
  ctx.restore();
}

/* ───────── 1층 : HUD 동기화 ───────── */
const $ = id => document.getElementById(id);
function syncHUD(){
  $('wv').textContent = S.wave;
  const mm = Math.floor(S.t/60), ss = Math.floor(S.t%60);
  $('clock').textContent = String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  const xpP = S.xp / S.xpNeed;
  $('xpfill').style.width = (xpP*100).toFixed(1) + '%';
  $('xplab').textContent = 'Lv.' + S.level + '/50 (' + (xpP*100).toFixed(1) + '%)';
  $('mult').textContent = 'X' + S.mult.toFixed(1);
  $('hpn').textContent = Math.round(S.hp);
  $('hpf').style.width = (S.hp/S.hpMax*100) + '%';
  $('shn').textContent = Math.round(S.shield);
  $('shf').style.width = (S.shield/S.shMax*100) + '%';
  $('coin').textContent = 300 + S.kills*2;
  const peak = Math.max(1, ...S.skills.map(s => s.dmg));
  S.skills.forEach((s,i) => {
    $('sr'+i).classList.toggle('on', s.on);
    $('sr'+i).querySelector('b').textContent = 'Lv' + s.lv;
    $('sf'+i).style.width = s.on ? (s.dmg/peak*100) + '%' : '0%';
    $('sv'+i).textContent = s.on ? fmt(s.dmg) : '–';
  });
}
function fmt(n){
  if (n >= 1000) return (n/1000).toFixed(n >= 10000 ? 0 : 1).replace('.0','') + 'k';
  return String(Math.round(n));
}
let toastT = 0;
function toast(k, v){
  $('tk').textContent = k; $('tv').innerHTML = v;
  $('toast').classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => $('toast').classList.remove('show'), 2100);
}

/* 스킬 아이콘 (캔버스) */
function skillIcon(cnv, kind){
  const c = cnv.getContext('2d'); c.clearRect(0,0,38,38); c.translate(19,19);
  c.lineWidth = 2.2;
  if (kind === 'dot'){
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0,0,9,0,TAU); c.fill();
  } else if (kind === 'bolt'){
    c.fillStyle = '#b7419a';
    c.beginPath(); c.moveTo(2,-12); c.lineTo(-7,2); c.lineTo(-1,2);
    c.lineTo(-3,12); c.lineTo(7,-2); c.lineTo(1,-2); c.closePath(); c.fill();
  } else {
    c.strokeStyle = '#E8502A'; c.beginPath(); c.arc(0,0,11,0,TAU); c.stroke();
    c.fillStyle = '#E8502A'; c.beginPath(); c.arc(0,0,5,0,TAU); c.fill();
  }
}
SKILLS.forEach((s,i) => skillIcon($('si'+i), s.icon));

/* ───────── 1층 : 결과 화면 + CTA 발동 체인 ───────── */
function showEnd(){
  const peak = Math.max(1, ...S.skills.map(s => s.dmg));
  $('endres').innerHTML = S.skills.map(s =>
    '<div class="r"><span class="sico" style="width:44px;height:44px">' +
      '<canvas width="44" height="44" data-ic="' + s.icon + '"></canvas></span>' +
    '<span class="strack" style="flex:1;max-width:none;height:44px">' +
      '<i style="width:' + (s.dmg/peak*100) + '%"></i></span>' +
    '<span class="sval" style="font-size:27px;width:108px">' + fmt(s.dmg) +
    '</span></div>').join('');
  $('endres').querySelectorAll('canvas').forEach(c => {
    const x = c.getContext('2d'); x.translate(3,3); skillIcon(c, c.dataset.ic);
  });
  const loot = [['◈', S.kills], ['✦', Math.max(1,Math.floor(S.kills/28))],
                ['⬢', Math.max(1,Math.floor(S.kills/45))], ['◆', S.level],
                ['●', Math.round(S.combo/3)+12], ['⚡', S.awakened ? 5 : 1]];
  $('endloot').innerHTML = loot.map(l =>
    '<div><div class="g">' + l[0] + '</div><div class="c">' + l[1] + '</div></div>').join('');
  $('end').classList.add('show');
  $('ui').classList.add('ended');
}
function go(){
  /* 광고 네트워크가 window.playableCTA 를 정의해 두면 그쪽으로 넘긴다
     (mraid.open 등). 없으면 새 탭, 그것도 막히면 현재 창 이동. */
  if (typeof window.playableCTA === 'function'){ window.playableCTA(CTA_URL); return; }
  try {
    if (!window.open(CTA_URL, '_blank')) location.href = CTA_URL;
  } catch(e){ location.href = CTA_URL; }
}
$('ctaPill').addEventListener('click', go);
$('ctaMain').addEventListener('click', go);
$('again').addEventListener('click', reset);

function loop(now){
