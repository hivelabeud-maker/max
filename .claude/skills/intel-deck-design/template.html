<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>INTEL DECK — 프로젝트명</title>
<!-- ⚠️ Artifact 발행 시 외부 폰트 CDN은 CSP로 차단된다. 시스템 폰트 스택만 사용할 것 -->
<style>
:root{
  --bg:#ffffff;--panel:#fff;--panel2:#fafafa;--ink:#161616;--muted:#77756e;--line:#e6e5e3;
  --accent:#1a1a17;--shadow:0 12px 30px rgba(24,24,24,.06);
  --pink:#ff86f6;--blue:#2e53f9;--lime:#c5ff79;--orange:#ff6e23;
  --pink2:#ffeafd;--blue2:#e7ecfe;--lime2:#eeffd9;--orange2:#ffe4d3;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
         "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:#ffffff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);letter-spacing:-.015em;font-size:14px}
button{font:inherit}

/* ---------- topbar ---------- */
.topbar{height:72px;background:#151817;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{width:34px;height:34px;border:1px solid rgba(255,255,255,.24);border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:10px;background:linear-gradient(145deg,#2b2a26,#0f0f0e);flex:none}
.brand h1{font-size:15px;margin:0 0 3px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:10px;color:rgba(255,255,255,.5);margin:0;letter-spacing:.04em}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.pill{font-size:10px;padding:5px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.72)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:calc(100vh - 72px)}
.sidebar{background:#ffffff;border-right:1px solid var(--line);padding:21px 15px 40px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}
.project-mini{padding:13px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.eyebrow{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.project-mini h2{font-size:13px;margin:6px 0 4px;line-height:1.4}
.project-mini p{font-size:10px;color:var(--muted);margin:0}
.progress{height:4px;background:#efefed;border-radius:5px;margin-top:11px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent)}
.nav-label{font-size:9px;font-weight:800;color:#97948c;letter-spacing:.13em;margin:17px 10px 7px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:7px;color:#68665f;text-align:left;cursor:pointer;font-size:11px;margin:2px 0}
.nav-item:hover{background:#f3f3f2;color:#222}
.nav-item.active{background:var(--accent);color:#fff;font-weight:700}
.nav-num{font-family:var(--mono);font-size:9px;opacity:.7;width:17px;flex:none}
.nav-badge{margin-left:auto;font-size:8px;border-radius:99px;padding:2px 6px;background:rgba(0,0,0,.08);flex:none}
.nav-item.active .nav-badge{background:rgba(255,255,255,.16)}
.main{padding:30px 34px 70px;max-width:1600px;width:100%}
.view{display:none}.view.active{display:block}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:21px}
.page-title h2{font-size:25px;line-height:1.15;margin:3px 0 7px;letter-spacing:-.04em}
.page-title p{font-size:12px;color:var(--muted);margin:0}
.head-meta{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:9px;font-weight:700;border-radius:999px;padding:5px 9px;background:#fff;border:1px solid var(--line);color:#555;white-space:nowrap}
.tag.green{color:#4f6e1c;background:var(--lime2);border-color:#c8f0a0}
.tag.amber{color:#a04a10;background:var(--orange2);border-color:#ffc6a0}
.tag.blue{color:var(--blue);background:var(--blue2);border-color:#c7d3fb}
.tag.red{color:#a63c9a;background:var(--pink2);border-color:#ffc7f8}

/* ---------- grid & card ---------- */
.grid{display:grid;gap:13px}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{font-size:13px;margin:0 0 10px}
.card p{font-size:11px;color:#4f4d47;line-height:1.65;margin:0}
.metric .label{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.metric .value{font-size:24px;font-weight:900;margin:6px 0 2px;letter-spacing:-.045em;line-height:1.1}
.metric .sub{font-size:9px;color:var(--muted)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 11px;gap:14px}
.section-title h3{font-size:15px;margin:0}
.section-title .sn{font-family:var(--mono);font-size:9px;color:var(--muted);font-weight:800;margin-right:7px}
.section-title p{font-size:10px;color:var(--muted);margin:0;text-align:right}

/* ---------- 1. HERO ---------- */
.hero{background:linear-gradient(135deg,#1a1a17,#2c2b26);color:#fff;border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:1.5fr .9fr;gap:24px;box-shadow:0 16px 36px rgba(20,20,18,.16)}
.hero .eyebrow{color:rgba(255,255,255,.55)}
.hero h3{font-size:23px;line-height:1.35;letter-spacing:-.04em;margin:8px 0 11px}
.hero p{font-size:11.5px;line-height:1.7;color:rgba(255,255,255,.72);margin:0}
.hero-side{border-left:1px solid rgba(255,255,255,.16);padding-left:20px;display:flex;flex-direction:column;justify-content:center;gap:9px}
.hero-side .kv2{font-size:10px;color:rgba(255,255,255,.55);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:6px}
.hero-side .kv2 b{color:#fff;font-weight:700;text-align:right}
.hero-swatch{display:flex;height:10px;border-radius:4px;overflow:hidden;margin-top:4px}
.hero-swatch span{flex:1}

/* ---------- kv list ---------- */
.kv{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv dt,.kv dd{margin:0;padding:11px 0;font-size:11px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{line-height:1.6}

/* ---------- 3. 3분할 컬럼 ---------- */
.motiv{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.mv{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;border-top:3px solid var(--line)}
.mv.f{border-top-color:var(--blue)}.mv.e{border-top-color:var(--pink)}.mv.d{border-top-color:var(--lime)}
.mv .mk{font-size:9px;font-weight:800;letter-spacing:.09em;color:var(--muted)}
.mv h4{font-size:13px;margin:7px 0}
.mv.f h4{color:var(--blue)}.mv.e h4{color:#c23bb3}.mv.d h4{color:#5a7d1a}
.mv p{font-size:10.5px;color:#5b5952;line-height:1.6;margin:0}

/* ---------- chips ---------- */
.kwset{display:flex;gap:6px;flex-wrap:wrap}
.kwset span{font-size:10px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;color:#444}
.kwset.blue span{background:var(--blue2);border-color:#c7d3fb;color:var(--blue)}

/* ---------- 4. 등급 카드 ---------- */
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.ch{position:relative;background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 14px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.ch .grade{position:absolute;top:12px;right:12px;font-size:9px;font-weight:900;width:20px;height:20px;border-radius:5px;display:grid;place-items:center}
.ch .grade.S{background:var(--blue);color:#fff}
.ch .grade.A{background:var(--lime);color:#1c2b06}
.ch .grade.B{background:#f3f3f2;color:#666}
.ch .grade.C{background:#f4f3ef;color:#9a978f}
.ch .cn{font-weight:800;font-size:13px;padding-right:26px}
.ch .cr{font-size:9.5px;color:var(--muted);font-weight:700}
.ch .cd{font-size:10px;color:#4f4d47;line-height:1.55;flex:1}
.ch .cw{font-size:9px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px;margin-top:auto}

/* ---------- 5. TOP 5 스트립 ---------- */
.dna{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.dn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.dn .dnum{font-family:var(--mono);font-size:9px;color:var(--blue);font-weight:800}
.dn strong{display:block;font-size:11.5px;margin:7px 0 4px;line-height:1.35}
.dn span{font-size:9.5px;color:var(--muted);line-height:1.5;display:block}

/* ---------- row list ---------- */
.scene{display:grid;grid-template-columns:1.3fr 1fr auto;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.scene:last-child{border-bottom:0}
.scene strong{font-size:11.5px;display:block;line-height:1.5}
.scene .sw{font-size:10px;color:var(--muted);line-height:1.55}

/* ---------- 6. SAFE / CAUTION / DO NOT USE ---------- */
.memes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meme{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px;display:flex;flex-direction:column;gap:7px}
.meme .lbl{font-size:8px;font-weight:900;padding:3px 7px;border-radius:5px;width:max-content;letter-spacing:.05em}
.meme .lbl.safe{background:var(--lime);color:#1c2b06}
.meme .lbl.caution{background:var(--pink);color:#3a0a34}
.meme .lbl.no{background:var(--orange);color:#fff}
.meme .mt{font-weight:800;font-size:13px}
.meme .md{font-size:10px;color:#5b5952;line-height:1.6;flex:1}
.meme .mr{font-size:9.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}

/* ---------- 7. timeline ---------- */
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.tls{position:relative;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 10px;min-height:92px}
.tls.hot{border:2px solid var(--accent);background:#fafafa}
.tls .num{font-family:var(--mono);font-size:9px;color:var(--muted)}
.tls strong{display:block;font-size:10.5px;margin:7px 0 3px;line-height:1.35}
.tls span{font-size:9px;color:var(--muted);line-height:1.4}

/* ---------- avoid rows ---------- */
.avoid{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.avoid:last-child{border-bottom:0}
.avoid strong{font-size:11px;color:#a04a10}
.avoid span{font-size:10.5px;color:#5b5952;line-height:1.6}

/* ---------- trigger map ---------- */
.trig{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.tg .tk{font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--blue)}
.tg .tw{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.tg .tw span{font-size:9.5px;background:#f4f3ef;border-radius:5px;padding:3px 7px;color:#4f4d47}

/* ---------- 8. cheat sheet ---------- */
.cheat{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.cheat-head{background:#1a1a17;color:#fff;padding:18px 22px}
.cheat-head h3{font-size:17px;margin:5px 0 0;letter-spacing:-.03em}
.cheat-body{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.cb{background:#fff;padding:16px 18px}
.cb .cbk{font-size:8.5px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
.cb ul{margin:8px 0 0;padding-left:15px}
.cb li{font-size:10.5px;line-height:1.65;color:#4f4d47;margin:3px 0}
.cb.warn .cbk{color:var(--orange)}
.cb.warn li{color:#8a5636}

/* ---------- starter ---------- */
.starter{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.st{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px}
.st .sk{font-family:var(--mono);font-size:9px;color:var(--blue);font-weight:800}
.st h4{font-size:13px;margin:7px 0 6px}
.st .sd{font-size:10.5px;color:#5b5952;line-height:1.6}
.st .sm{font-size:9.5px;color:var(--muted);margin-top:9px;border-top:1px solid var(--line);padding-top:8px}

/* ---------- 9. DATA GAP ---------- */
.gap{background:var(--orange2);border:1px solid #ffc6a0;border-radius:10px;padding:14px 16px}
.gap strong{font-size:11px;color:#a04a10;display:block;margin-bottom:5px}
.gap p{font-size:10px;color:#8a5636;line-height:1.6;margin:0}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 16px;font-size:10px;color:var(--muted);line-height:1.65}
.note b{color:var(--ink)}

/* ---------- index cards ---------- */
.brand-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.brand-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0;display:flex;flex-direction:column;min-height:186px;cursor:pointer;text-align:left;box-shadow:var(--shadow);overflow:hidden}
.brand-card:hover{border-color:#b3b0a8}
.brand-card .bsw{display:flex;height:7px}
.brand-card .bsw span{flex:1}
.brand-card .bin{padding:14px;display:flex;flex-direction:column;gap:5px;flex:1}
.brand-card .tb{position:absolute;top:15px;right:12px;font-size:8px;font-weight:800;padding:2px 6px;border-radius:5px}
.brand-card .tb.own{background:var(--blue2);color:var(--blue)}
.brand-card .tb.lic{background:var(--pink2);color:#a63c9a}
.brand-card .nm{font-weight:800;font-size:12.5px;padding-right:44px;line-height:1.35}
.brand-card .meta{font-size:9.5px;color:var(--muted);line-height:1.5}
.brand-card .desc{font-size:10px;color:#4f4d47;line-height:1.5;flex:1}
.brand-card .kws{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.brand-card .kws span{font-size:8.5px;background:#f4f3ef;border-radius:4px;padding:2px 6px;color:#666}

.footer-note{margin-top:24px;font-size:9px;color:#9a978f;text-align:center}

@media(max-width:1300px){.brand-grid{grid-template-columns:repeat(4,1fr)}.dna{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1100px){
  .layout{grid-template-columns:205px minmax(0,1fr)}.main{padding:25px 22px 60px}
  .grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}.hero-side{border-left:0;border-top:1px solid rgba(255,255,255,.16);padding:15px 0 0}
  .motiv,.chars,.memes,.trig,.cheat-body,.starter{grid-template-columns:1fr}
  .brand-grid{grid-template-columns:repeat(3,1fr)}
  .tl{grid-template-columns:repeat(2,1fr)}.scene,.avoid{grid-template-columns:1fr;gap:6px}
}
@media(max-width:740px){
  .topbar{padding:0 16px}.top-actions .pill{display:none}
  .layout{display:block}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;overflow:auto;gap:4px}
  .project-mini,.nav-label{display:none}
  .nav-item{width:auto;white-space:nowrap}.nav-item .nav-num,.nav-item .nav-badge{display:none}
  .main{padding:20px 14px 50px}
  .grid.cols-4{grid-template-columns:1fr}.page-head{display:block}.head-meta{justify-content:flex-start;margin-top:12px}
  .brand-grid,.dna{grid-template-columns:1fr}
}
@media print{
  .topbar,.sidebar{display:none!important}.layout{display:block}.main{padding:0;max-width:none}
  .view{display:block!important;page-break-before:always}.view:first-child{page-break-before:auto}
  .card,.hero,.cheat{box-shadow:none;break-inside:avoid}body{background:#fff}
}
</style>
</head>
<body>

<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">XX</div>
    <div><h1>프로젝트명 <span style="font-weight:400;color:#849c95">/ Intelligence</span></h1>
    <p>한 줄 부제 — 이 문서가 답하는 질문</p></div></div>
  <div class="top-actions"><span class="pill" id="topPill">전체 N개 항목</span></div>
</header>

<div class="layout">
<aside class="sidebar">
  <div class="project-mini"><div class="eyebrow">INTEL</div><h2>프로젝트명</h2><p>2026.00 기준 · N / M 조사 완료</p>
    <div class="progress"><span style="width:70%"></span></div></div>
  <div class="nav-label">OVERVIEW</div>
  <button class="nav-item active" data-view="index"><span class="nav-num">00</span>전체 인덱스<span class="nav-badge">N</span></button>
  <div class="nav-label">그룹 A</div>
  <button class="nav-item" data-view="item1"><span class="nav-num">01</span>항목 1</button>
  <button class="nav-item" data-view="item2"><span class="nav-num">02</span>항목 2</button>
  <!-- 항목 수만큼 추가. 그룹이 바뀌면 .nav-label 삽입 -->
</aside>

<main class="main" id="main"></main>
</div>
</div>

<script>
/* ============================================================
   데이터만 갈아끼운다. CSS·렌더 함수는 손대지 않는다.
   ============================================================ */
const G = [
 {
  id:"item1", no:"01", name:"항목 이름", ip:"own", ipl:"분류 라벨",
  meta1:"메타1", meta2:"메타2", meta3:"메타3",
  sw:["#14161A","#2B3038","#4A5262","#C8862A"],           // 톤 스와치 4칸
  one:"이 항목을 한 문장으로 정의하면.",
  heroP:"왜 이 한 줄인가 — <b>핵심</b>을 짚는 해설 2~3문장.",
  kv:[["플랫폼","값"],["지역","값"],["핵심 타깃","값"],["가장 큰 차별점","값"]],
  motiv:[
   ["FUNCTIONAL","기능적 동기","설명."],
   ["EMOTIONAL","감정적 동기","설명."],
   ["FANDOM","팬심 동기","설명."]],
  body:"본문 요약 3~5줄.",
  kws:["키워드1","키워드2","키워드3"],
  chars:[["이름","역할","S","설명.","주의사항"],
         ["이름","역할","A","설명.",""]],
  dna:[["요소1","설명"],["요소2","설명"],["요소3","설명"],["요소4","설명"],["요소5","설명"]],
  scenes:[["장면","맥락","왜 중요한가","★★★★★"]],
  labels:[["항목","safe","설명.","판정 근거 — 반드시 쓴다"],
          ["항목","caution","설명.","판정 근거"],
          ["항목","no","설명.","판정 근거"]],
  tl:[["시점","사건","설명",""],["시점","사건","설명","hot"]],
  worked:[["패턴","★★★★★","근거"]],
  avoid:[["피할 것","왜 알아야 하는가"]],
  trig:[["CATEGORY",["키워드","키워드"]]],
  cheat:{must:["반드시 알 것"],use:["활용할 것"],fan:["선호 요소"],copy:["카피 단어"],avoid:["주의"]},
  starter:[["채널","아이디어명","설명","리스크·조건"]],
  gaps:["미조사 항목","미확인 항목"]
 }
];

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const sw = a => `<div class="hero-swatch">${a.map(c=>`<span style="background:${c}"></span>`).join("")}</div>`;

function indexView(){
  return `
  <div class="page-head"><div class="page-title"><div class="eyebrow">INDEX</div>
    <h2>인덱스 제목</h2><p>카드를 누르면 상세로 이동합니다.</p></div>
    <div class="head-meta"><span class="tag blue">그룹 A</span><span class="tag red">그룹 B</span></div></div>

  <!-- 1. Metric Row — 전체 규모 -->
  <div class="grid cols-4">
    <div class="card metric"><div class="label">라벨</div><div class="value">0</div><div class="sub">서브</div></div>
  </div>

  <!-- 2. 항목 카드 그리드 -->
  <div class="section-title"><h3><span class="sn">A</span>항목 인덱스</h3><p>클릭하면 상세</p></div>
  <div class="brand-grid">${G.map(g=>`
    <button class="brand-card" data-go="${g.id}">
      <div class="bsw">${g.sw.map(c=>`<span style="background:${c}"></span>`).join("")}</div>
      <div class="bin"><span class="tb ${g.ip}">${esc(g.ipl)}</span>
        <div class="nm">${esc(g.name)}</div>
        <div class="meta">${esc(g.meta1)}<br>${esc(g.meta2)}</div>
        <div class="desc">${esc(g.one)}</div>
        <div class="kws">${g.kws.slice(0,4).map(k=>`<span>${esc(k)}</span>`).join("")}</div>
      </div></button>`).join("")}</div>

  <!-- 3. 교차 인사이트 — 이 포맷의 진짜 값어치 -->
  <div class="section-title"><h3><span class="sn">B</span>항목을 나란히 놓았을 때만 보이는 것</h3><p>개별 나열로는 안 나오는 판단</p></div>
  <div class="grid cols-3">
    <div class="card"><h3>교차 인사이트 1</h3><p>내용</p></div>
  </div>`;
}

function itemView(g){
  return `
  <div class="page-head"><div class="page-title"><div class="eyebrow">${g.no} · ${esc(g.ipl)}</div>
    <h2>${esc(g.name)}</h2><p>${esc(g.meta1)} · ${esc(g.meta2)} · ${esc(g.meta3)}</p></div>
    <div class="head-meta"><span class="tag blue">${esc(g.ipl)}</span></div></div>

  <div class="hero">
    <div><div class="eyebrow">ONE-LINE DEFINITION</div><h3>${esc(g.one)}</h3><p>${g.heroP}</p></div>
    <div class="hero-side">
      ${g.kv.map(k=>`<div class="kv2"><span>${esc(k[0])}</span><b>${esc(k[1])}</b></div>`).join("")}
      ${sw(g.sw)}<div style="font-size:9px;color:rgba(255,255,255,.4)">톤 스와치 — 공식 컬러 아님</div>
    </div></div>

  <div class="section-title"><h3><span class="sn">02</span>WHY</h3><p>3가지 관점</p></div>
  <div class="motiv">${g.motiv.map((m,i)=>`<div class="mv ${["f","e","d"][i]}"><div class="mk">${m[0]}</div><h4>${esc(m[1])}</h4><p>${esc(m[2])}</p></div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">03</span>본문</h3></div>
  <div class="card flat"><p style="font-size:12px;line-height:1.8">${esc(g.body)}</p>
    <div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:8px">키워드</div>
    <div class="kwset blue">${g.kws.map(k=>`<span>${esc(k)}</span>`).join("")}</div></div></div>

  <div class="section-title"><h3><span class="sn">04</span>등급 카드</h3><p>S / A / B / C</p></div>
  <div class="chars">${g.chars.map(c=>`<div class="ch"><span class="grade ${c[2]}">${c[2]}</span>
    <div class="cn">${esc(c[0])}</div><div class="cr">${esc(c[1])}</div><div class="cd">${esc(c[3])}</div>
    ${c[4]?`<div class="cw">${esc(c[4])}</div>`:""}</div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">05</span>TOP 5</h3></div>
  <div class="dna">${g.dna.map((d,i)=>`<div class="dn"><div class="dnum">0${i+1}</div><strong>${esc(d[0])}</strong><span>${esc(d[1])}</span></div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">06</span>주요 항목</h3></div>
  <div class="card flat">${g.scenes.map(s=>`<div class="scene"><div><strong>${esc(s[0])}</strong>
    <div class="sw" style="margin-top:4px">${esc(s[1])}</div></div><div class="sw">${esc(s[2])}</div>
    <div style="font-size:11px;color:var(--orange);white-space:nowrap">${s[3]}</div></div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">07</span>SAFE / CAUTION / DO NOT USE</h3><p>사용 가부 판정</p></div>
  <div class="memes">${g.labels.map(m=>`<div class="meme">
    <span class="lbl ${m[1]}">${m[1]==='safe'?'SAFE':m[1]==='caution'?'CAUTION':'DO NOT USE'}</span>
    <div class="mt">${esc(m[0])}</div><div class="md">${esc(m[2])}</div>
    ${m[3]?`<div class="mr">${esc(m[3])}</div>`:""}</div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">08</span>TIMELINE</h3><p>인식이 바뀐 사건만</p></div>
  <div class="tl">${g.tl.map(t=>`<div class="tls ${t[3]||''}"><div class="num">${esc(t[0])}</div>
    <strong>${esc(t[1])}</strong><span>${esc(t[2])}</span></div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">09</span>WHAT WORKED</h3></div>
  <div class="card flat">${g.worked.map(w=>`<div class="scene" style="grid-template-columns:1fr auto 1.4fr">
    <strong>${esc(w[0])}</strong><div style="font-size:11px;color:var(--orange);white-space:nowrap">${w[1]}</div>
    <div class="sw">${esc(w[2])}</div></div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">10</span>WHAT TO AVOID</h3><p>왜 알아야 하는가까지</p></div>
  <div class="card flat">${g.avoid.map(a=>`<div class="avoid"><strong>${esc(a[0])}</strong><span>${esc(a[1])}</span></div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">11</span>TRIGGER MAP</h3></div>
  <div class="trig">${g.trig.map(t=>`<div class="tg"><div class="tk">${esc(t[0])}</div>
    <div class="tw">${t[1].map(k=>`<span>${esc(k)}</span>`).join("")}</div></div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">12</span>CHEAT SHEET</h3><p>한 화면 요약</p></div>
  <div class="cheat"><div class="cheat-head"><div class="eyebrow" style="color:rgba(255,255,255,.5)">CHEAT SHEET</div>
    <h3>${esc(g.name)} — 이것만 알면 시작할 수 있다</h3></div>
  <div class="cheat-body">
    <div class="cb"><div class="cbk">MUST KNOW</div><ul>${g.cheat.must.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="cb"><div class="cbk">MUST USE</div><ul>${g.cheat.use.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="cb"><div class="cbk">FAVORITES</div><ul>${g.cheat.fan.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="cb"><div class="cbk">KEYWORDS</div><div class="kwset" style="margin-top:9px">${g.cheat.copy.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
    <div class="cb warn"><div class="cbk">AVOID</div><ul>${g.cheat.avoid.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="cb"><div class="cbk">TOP 3</div><ul>${g.dna.slice(0,3).map(d=>`<li>${esc(d[0])}</li>`).join("")}</ul></div>
  </div></div>

  <div class="section-title"><h3><span class="sn">13</span>STARTER</h3><p>바로 쓸 수 있는 출발점</p></div>
  <div class="starter">${g.starter.map(s=>`<div class="st"><div class="sk">${esc(s[0])}</div>
    <h4>${esc(s[1])}</h4><div class="sd">${esc(s[2])}</div><div class="sm">${esc(s[3])}</div></div>`).join("")}</div>

  <div class="section-title"><h3><span class="sn">14</span>DATA GAP</h3><p>아직 확인되지 않은 것</p></div>
  <div class="gap"><strong>추측으로 채우지 않은 항목 — 사용 전 반드시 확인</strong>
    <p>${g.gaps.map(x=>"· "+esc(x)).join("<br>")}</p></div>

  <div class="footer-note">${esc(g.name)} · 확인일 0000.00.00 · 출처 별도 참조</div>`;
}

const main = document.getElementById("main");
const views = {index:indexView};
G.forEach(g => views[g.id] = () => itemView(g));

function show(id){
  main.innerHTML = `<section class="view active">${(views[id]||views.index)()}</section>`;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active", b.dataset.view===id));
  const g = G.find(x=>x.id===id);
  document.getElementById("topPill").textContent = g ? `${g.no} · ${g.name}` : `전체 ${G.length}개 항목`;
  window.scrollTo({top:0,behavior:"instant"});
}
document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));
main.addEventListener("click",e=>{const t=e.target.closest("[data-go]"); if(t) show(t.dataset.go);});
show("index");
</script>
</body>
</html>
