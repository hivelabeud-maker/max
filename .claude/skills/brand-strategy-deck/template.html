  --pink2:#ffeafd;--blue2:#e7ecfe;--lime2:#eeffd9;--orange2:#ffe4d3;
  /* 의미 배정: blue=T1·핵심정보  lime=T2·긍정/기회  pink=T3·보류/중간위험  orange=T4·위험/회피 */

/* 브랜드 밸류 키워드 */
.bvk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.bvk-col{border-top:3px solid var(--line);padding-top:16px;display:flex;flex-direction:column;min-height:280px}
.bvk-col.c-blue{border-top-color:var(--blue)}.bvk-col.c-lime{border-top-color:var(--lime)}.bvk-col.c-pink{border-top-color:var(--pink)}.bvk-col.c-orange{border-top-color:var(--orange)}
.bvk-id{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px}
.bvk-title{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin-bottom:14px}
.bvk-col.c-blue .bvk-title{color:var(--blue)}.bvk-col.c-lime .bvk-title{color:#5a7d1a}.bvk-col.c-pink .bvk-title{color:#c23bb3}.bvk-col.c-orange .bvk-title{color:var(--orange)}
.bvk-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.bvk-tags span{font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink2)}
.bvk-desc{font-size:12px;color:#4f4d47;line-height:1.7;flex:1}
.bvk-sensory{font-size:9.5px;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.bvk-sensory b{display:block;font-size:8.5px;color:#9a978f;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
@media(max-width:900px){.bvk-grid{grid-template-columns:1fr}}
@media(max-width:1100px){.layout{grid-template-columns:205px minmax(0,1fr)}.main{padding:25px 22px 60px}.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:1fr}.flow{grid-template-columns:repeat(4,1fr)}.decision,.reco-head{grid-template-columns:1fr}.decision-side,.reco-score{border-left:0;border-top:1px solid rgba(255,255,255,.16);padding:15px 0 0;align-items:flex-start}.streams{grid-template-columns:repeat(2,1fr)}.principles,.roadmap,.not-doing,.axis-grid,.cat-cards,.bta{grid-template-columns:1fr}.risk{grid-template-columns:1fr 1fr}.request-vs,.ws-grid{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
@media(max-width:740px){.topbar{padding:0 16px}.top-actions .pill,.top-btn.print{display:none}.layout{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;overflow:auto;gap:4px}.project-mini,.nav-label{display:none}.nav-item{width:auto;white-space:nowrap}.nav-item .nav-num,.nav-item .nav-badge{display:none}.main{padding:20px 14px 50px}.grid.cols-4,.grid.cols-2{grid-template-columns:1fr}.page-head{display:block}.head-meta{justify-content:flex-start;margin-top:12px}.flow{grid-template-columns:repeat(2,1fr)}.streams{grid-template-columns:1fr}.search{margin-left:0;width:100%}.risk{grid-template-columns:1fr}.source-card{grid-template-columns:1fr}}
@media print{.topbar,.sidebar,.filters,.top-actions{display:none!important}.layout{display:block}.main{padding:0;max-width:none}.view{display:block!important;page-break-before:always}.view:first-child{page-break-before:auto}.card,.strategy-card,.reco-hero,.decision,.pmap{box-shadow:none;break-inside:avoid}.page-head{margin-top:24px}body{background:#fff}}
</style>
</head>
<body>
<div class="app">
<!-- 데이터 정본은 report-data.json. 아래는 추적/재생성용 사본. -->
<script type="application/json" id="report-data">{{REPORT_DATA_JSON}}</script>

<header class="topbar">
  <div class="brand"><div class="brand-mark">{{BRAND_INITIALS}}</div>
    <div><h1>{{PROJECT_NAME}} <span style="font-weight:400;color:#849c95">/ Brand Strategy</span></h1>
    <p>근거에서 전략까지 연결되는 브랜드 리서치 대시보드</p></div></div>
  <div class="top-actions"><span class="pill">{{RESEARCH_MODE}}</span>
    <button class="top-btn" onclick="toggleAll()">전체 펼침</button>
    <button class="top-btn print" onclick="window.print()">PDF 출력</button></div>
</header>

<div class="layout">
<aside class="sidebar">
  <div class="project-mini"><div class="eyebrow">CURRENT PROJECT</div><h2>{{PROJECT_NAME}}</h2><p>{{PROJECT_SUBTITLE}}</p><div class="progress"><span></span></div></div>
  <div class="nav-label">DECISION FLOW</div>
  <button class="nav-item active" data-view="overview"><span class="nav-num">00</span>요약 대시보드<span class="nav-badge">LIVE</span></button>
  <button class="nav-item" data-view="brief"><span class="nav-num">01</span>브리프·문제 정의</button>
  <button class="nav-item" data-view="factbook"><span class="nav-num">02</span>브랜드 팩트북</button>
  <button class="nav-item" data-view="competitors"><span class="nav-num">03</span>경쟁 리서치<span class="nav-badge">{{COMP_COUNT}}</span></button>
  <button class="nav-item" data-view="positioning"><span class="nav-num">04</span>포지셔닝 맵</button>
  <button class="nav-item" data-view="whitespace"><span class="nav-num">05</span>화이트스페이스</button>
  <button class="nav-item" data-view="cross"><span class="nav-num">06</span>이종업계<span class="nav-badge">{{CROSS_COUNT}}</span></button>
  <button class="nav-item" data-view="insights"><span class="nav-num">07</span>핵심 인사이트<span class="nav-badge">{{INSIGHT_COUNT}}</span></button>
  <button class="nav-item" data-view="keywords"><span class="nav-num">08</span>브랜드 밸류 키워드<span class="nav-badge">{{BVK_COUNT}}</span></button>
  <button class="nav-item" data-view="options"><span class="nav-num">09</span>전략 대안<span class="nav-badge">{{STRAT_COUNT}}</span></button>
  <button class="nav-item" data-view="recommendation"><span class="nav-num">10</span>추천 전략</button>
  <div class="nav-label">AUDIT & TRACE</div>
  <button class="nav-item" data-view="sources"><span class="nav-num">11</span>출처·근거 추적<span class="nav-badge">{{SOURCE_COUNT}}</span></button>
</aside>

<main class="main">
  <section class="view active" id="overview"><!-- OVERVIEW --></section>
  <section class="view" id="brief"><!-- BRIEF --></section>
  <section class="view" id="factbook"><!-- FACTBOOK --></section>
  <section class="view" id="competitors"><!-- COMPETITORS --></section>
  <section class="view" id="positioning"><!-- POSITIONING --></section>
  <section class="view" id="whitespace"><!-- WHITESPACE --></section>
  <section class="view" id="cross"><!-- CROSS --></section>
  <section class="view" id="insights"><!-- INSIGHTS --></section>
  <section class="view" id="keywords"><!-- KEYWORDS --></section>
  <section class="view" id="options"><!-- OPTIONS --></section>
  <section class="view" id="recommendation"><!-- RECOMMENDATION --></section>
  <section class="view" id="sources"><!-- SOURCES --></section>
</main>
</div>
</div>

<script>
const navItems=[...document.querySelectorAll('.nav-item')];
function goView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const t=document.getElementById(id);if(!t)return;t.classList.add('active');navItems.forEach(n=>n.classList.toggle('active',n.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'});history.replaceState(null,'','#'+id)}
navItems.forEach(n=>n.addEventListener('click',()=>goView(n.dataset.view)));
window.addEventListener('load',()=>{const h=location.hash.replace('#','');if(document.getElementById(h))goView(h)});
document.querySelectorAll('[data-goto]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();goView(a.dataset.goto)}));
function filterTable(gridId){const el=document.getElementById(gridId);if(!el)return;const wrap=el.closest('.view');const type=wrap.querySelector('.filter.active')?.dataset.filter||'all';const q=(wrap.querySelector('.search')?.value||'').toLowerCase();
  el.querySelectorAll('[data-type]').forEach(r=>{const mt=type==='all'||r.dataset.type===type;const mq=!q||r.innerText.toLowerCase().includes(q);r.style.display=mt&&mq?'':'none'});
  el.querySelectorAll('.group-block').forEach(g=>{const anyVisible=[...g.querySelectorAll('[data-type]')].some(c=>c.style.display!=='none');g.style.display=anyVisible?'':'none'})}
document.querySelectorAll('.filters').forEach(bar=>{bar.addEventListener('click',e=>{const b=e.target.closest('.filter');if(!b)return;bar.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterTable(bar.dataset.table)});const s=bar.querySelector('.search');if(s)s.addEventListener('input',()=>filterTable(bar.dataset.table))});
let expanded=false;function toggleAll(){expanded=!expanded;document.querySelector('.top-actions .top-btn').textContent=expanded?'대시보드 보기':'전체 펼침';document.querySelector('.sidebar').style.display=expanded?'none':'';document.querySelector('.layout').style.gridTemplateColumns=expanded?'1fr':'';document.querySelectorAll('.view').forEach(v=>v.style.display=expanded?'block':'');if(!expanded){document.querySelectorAll('.view').forEach(v=>v.style.display='');document.querySelector('.view.active').style.display='block'}}
</script>
</body>
</html>
