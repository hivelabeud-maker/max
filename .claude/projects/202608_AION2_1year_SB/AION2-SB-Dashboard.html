        },
        {
          "cut": 24,

          "time": "00:29–00:30",
          "screen": "AION2 로고 중앙 등장, 황금 배경",
          "angle": "정면, 중앙",
          "movement": "카메라 고정",
          "voice": "없음",
          "sfx": "SFX : 로고 음향, 오케스트라 폐막",
          "resource": "텍스트 오버레이 (디자인팀)",
          "url": "https://d8j0ntlcm91z4.cloudfront.net/generated/cut_24_logo_final.png"
        }
      ]
    }
  ]
}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #fff;
  --panel: #fff;
  --panel2: #fafaf8;
  --ink: #161616;
  --muted: #77756e;
  --line: #ede9e3;
  --accent: #1a1a17;
  --accent2: #e6e4dd;
  --blue: #2e53f9;
  --blue2: #e7ecfe;
  --orange: #ff6e23;
  --orange2: #ffe4d3;
  --ph: #ece9e2;
  --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --r-card: 14px;
  --r-badge: 6px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}

/* 헤더 고정 */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 20px 30px;
  backdrop-filter: blur(10px);
}

.header-content {
  max-width: 1400px;
  margin: 0 auto;
}

.header .eyebrow {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.header .title {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 6px;
}

.header .concept {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
  max-width: 600px;
}

/* 대시보드 레이아웃 */
.dashboard {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 0;
  max-width: 1400px;
  margin: 0 auto;
  min-height: calc(100vh - 160px);
}

/* 좌측 사이드바 */
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 20px 0;
  position: sticky;
  top: 120px;
  height: calc(100vh - 120px);
  overflow-y: auto;
}

/* Scene 탭 */
.nav-scenes {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.scene-tab {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-left: 3px solid transparent;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  font-size: 13px;
}

.scene-tab:hover {
  background: var(--panel2);
}

.scene-tab.active {
  background: var(--blue2);
  border-left-color: var(--blue);
}

.scene-tab .tab-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.06em;
}

.scene-tab .tab-title {
  font-size: 12px;
  font-weight: 500;
  line-height: 1.3;
}

.scene-tab.active .tab-title {
  color: var(--blue);
  font-weight: 600;
}

/* 포맷 선택 */
.format-select {
  padding: 16px;
  border-top: 1px solid var(--line);
  margin-top: auto;
}

.format-select .label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.format-btn {
  display: block;
  width: 100%;
  padding: 8px 12px;
  margin-bottom: 6px;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.format-btn:hover {
  border-color: var(--blue);
}

.format-btn.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}

/* 우측 콘텐츠 영역 */
.content {
  padding: 30px 40px;
  overflow-y: auto;
}

/* Scene 정보 */
.scene-info {
  margin-bottom: 30px;
}

.sec-h {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 18px;
}

.sec-h b {
  font-size: 15px;
  font-weight: 700;
}

.sec-h span {
  font-size: 11px;
  color: var(--muted);
}

.dir {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  overflow: hidden;
}

.dir .row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 16px;
  padding: 13px 20px;
  border-top: 1px solid var(--line);
}

.dir .row:first-child {
  border-top: 0;
}

.dir dt {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.04em;
  padding-top: 1px;
}

.dir dd {
  font-size: 12px;
  line-height: 1.5;
}

/* 컷 그리드 */
.cuts-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-top: 20px;
}

.cut {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.cut .still {
  position: relative;
  aspect-ratio: 16 / 9;
  background: var(--ph);
  overflow: hidden;
}

.cut .still img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  animation: fadeIn 0.3s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 3px 8px;
  border-radius: var(--r-badge);
}

.tag {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(22, 22, 22, 0.78);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: var(--r-badge);
  font-variant-numeric: tabular-nums;
}

.cut .in {
  padding: 11px 13px 13px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  flex: 1;
}

.cut-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
}

.f {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 8px;
  font-size: 11px;
}

.f dt {
  color: var(--muted);
  font-weight: 500;
}

.f dd {
  font-size: 11px;
  line-height: 1.4;
}

.line-voice {
  color: var(--blue);
  font-weight: 600;
  font-size: 12.5px;
  padding-top: 4px;
  border-top: 1px solid var(--line);
}

.line-sfx {
  color: var(--orange);
  font-weight: 600;
  font-size: 11px;
}

.res {
  margin-top: auto;
  padding-top: 8px;
  font-size: 10.5px;
  color: var(--muted);
  border-top: 1px dashed var(--line);
}

/* 반응형 */
@media (max-width: 1024px) {
  .dashboard {
    grid-template-columns: 180px 1fr;
  }

  .scene-tab {
    padding: 10px 12px;
  }

  .scene-tab .tab-title {
    font-size: 11px;
  }

  .content {
    padding: 20px 24px;
  }
}

@media (max-width: 768px) {
  .dashboard {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: none;
  }

  .content {
    padding: 20px 16px;
  }

  .cuts-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-content">
    <p class="eyebrow">Video SB / 30SEC · 24 CUTS</p>
    <h1 class="title">AION2 1주년 영상 본편</h1>
    <p class="concept">색 없는 어둠 속 천족이 각성한다...</p>
  </div>
</header>

<div class="dashboard">

  <!-- 좌측 사이드바 -->
  <aside class="sidebar">

    <!-- Scene 탭 -->
    <nav class="nav-scenes" id="sceneNav">
      <button class="scene-tab active" data-scene="01">
        <span class="tab-num">01</span>
        <span class="tab-title">어둠 속 천족의 등장</span>
      </button>
      <button class="scene-tab" data-scene="02">
        <span class="tab-num">02</span>
        <span class="tab-title">천족의 각성</span>
      </button>
      <button class="scene-tab" data-scene="03">
        <span class="tab-num">03</span>
        <span class="tab-title">황금 변환</span>
      </button>
      <button class="scene-tab" data-scene="04">
        <span class="tab-num">04</span>
        <span class="tab-title">비상 준비</span>
      </button>
      <button class="scene-tab" data-scene="05">
        <span class="tab-num">05</span>
        <span class="tab-title">우주적 결집</span>
      </button>
      <button class="scene-tab" data-scene="06">
        <span class="tab-num">06</span>
        <span class="tab-title">최종 상승 & 마무리</span>
      </button>
    </nav>

    <!-- 포맷 선택 -->
    <div class="format-select">
      <p class="label">포맷</p>
      <button class="format-btn active" data-format="16-9">
        🎬 16:9 Cinematic
      </button>
      <button class="format-btn" data-format="9-16">
        📱 9:16 Short-form
      </button>
    </div>

  </aside>

  <!-- 우측 콘텐츠 영역 -->
  <main class="content">

    <!-- 연출 방향 -->
    <section class="scene-info">
      <div class="sec-h">
        <b>연출 방향</b>
        <span id="sceneLabel">Scene 01</span>
      </div>
      <dl class="dir" id="directionContent">
        <!-- JavaScript에서 동적으로 채워짐 -->
      </dl>
    </section>

    <!-- 컷 그리드 -->
    <section>
      <div class="sec-h">
        <b>컷 시퀀스</b>
      </div>
      <div class="cuts-grid" id="cutsGrid">
        <!-- JavaScript에서 동적으로 채워짐 -->
      </div>
    </section>

  </main>

</div>

<script>
// 데이터 로드
const data = JSON.parse(document.getElementById('storyboard-data').textContent);
let currentScene = '01';
let currentFormat = '16-9';

// Scene 탭 이벤트
document.querySelectorAll('.scene-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const sceneNum = tab.dataset.scene;

    // 활성 탭 변경
    document.querySelectorAll('.scene-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    currentScene = sceneNum;
    renderContent();
  });
});

// 포맷 선택 이벤트
document.querySelectorAll('.format-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFormat = btn.dataset.format;
    // 포맷 변경 시 추가 로직 (CSS 클래스 변경 등)
  });
});

// 콘텐츠 렌더링
function renderContent() {
  const scene = data.scenes.find(s => s.number === currentScene);
  if (!scene) return;

  // Scene 레이블 업데이트
  document.getElementById('sceneLabel').textContent = `Scene ${scene.number}`;

  // 연출 방향 렌더링
  const directionHTML = `
    <div class="row">
      <dt>카메라</dt>
      <dd>${scene.direction.camera}</dd>
    </div>
    <div class="row">
      <dt>색상</dt>
      <dd>${scene.direction.color}</dd>
    </div>
    <div class="row">
      <dt>편집</dt>
      <dd>${scene.direction.edit}</dd>
    </div>
  `;
  document.getElementById('directionContent').innerHTML = directionHTML;

  // 컷 그리드 렌더링
  const cutsHTML = scene.cuts.map(cut => `
    <article class="cut">
      <div class="still">
        <img
          src="${cut.url}"
          alt="CUT ${String(cut.cut).padStart(2, '0')}: ${cut.title}"
          loading="lazy"
        />
        <span class="badge">CUT ${String(cut.cut).padStart(2, '0')}</span>
        <span class="tag">${cut.time}</span>
      </div>
      <div class="in">
        <p class="cut-title">${cut.title}</p>
        <dl class="f">
          <dt>화면</dt>
          <dd>${cut.screen}</dd>
        </dl>
        <dl class="f">
          <dt>앵글</dt>
          <dd>${cut.angle}</dd>
        </dl>
        <dl class="f">
          <dt>움직임</dt>
          <dd>${cut.movement}</dd>
        </dl>
        ${cut.voice ? `<p class="line-voice">${cut.voice}</p>` : ''}
        ${cut.sfx ? `<p class="line-sfx">${cut.sfx}</p>` : ''}
        <p class="res">${cut.resource}</p>
      </div>
    </article>
  `).join('');

  document.getElementById('cutsGrid').innerHTML = cutsHTML;
}

// 초기 렌더링
renderContent();
</script>

</body>
</html>
